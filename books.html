<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reading — Blue Chord Tape</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #1a3aff;
  --warm-white: #F9F7F4;
  --dark: #0e1a2e;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Public Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--warm-white);
  color: #1a1a1a;
  min-height: 100vh;
}

/* ─── NAV ─────────────────────────────────────────────────── */
.nav {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--warm-white);
  border-bottom: 1px solid #e2e0db;
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-back {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #1a1a1a;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  transition: color 0.15s;
}
.nav-back:hover { color: var(--primary); }
.nav-back-arrow {
  font-size: 16px;
  line-height: 1;
  color: var(--primary);
}

.nav-title {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #bbb;
}

/* ─── HEADER ──────────────────────────────────────────────── */
.page-header {
  padding: 64px 24px 48px;
  max-width: 740px;
  margin: 0 auto;
}

.page-label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 16px;
}

.page-title {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  color: #111;
}

.page-desc {
  margin-top: 16px;
  font-size: 13px;
  color: #888;
  letter-spacing: 0.02em;
  line-height: 1.6;
}

/* ─── BOOK LIST ───────────────────────────────────────────── */
.book-list {
  max-width: 740px;
  margin: 0 auto;
  padding: 0 24px 120px;
}

.list-divider {
  width: 100%;
  height: 2px;
  background: var(--primary);
  margin-bottom: 0;
}

.book-item {
  border-bottom: 1px solid #e2e0db;
}

.book-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 24px 16px;
  cursor: pointer;
  gap: 16px;
  transition: background 0.2s, padding-left 0.2s;
  user-select: none;
}
.book-header:hover {
  background: rgba(26, 58, 255, 0.03);
  padding-left: 24px;
}

.book-left {
  display: flex;
  align-items: flex-start;
  gap: 24px;
  flex: 1;
  min-width: 0;
}

@media (min-width: 640px) {
  .book-left { gap: 40px; }
}

.book-num {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--primary);
  flex-shrink: 0;
  padding-top: 2px;
}

.book-meta { flex: 1; min-width: 0; }

.book-title {
  font-size: 15px;
  font-weight: 500;
  color: #1a1a1a;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.book-info {
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.book-author {
  font-size: 12px;
  color: #888;
  letter-spacing: 0.02em;
}

.book-date {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #bbb;
}

.book-tag {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--primary);
  border: 1px solid rgba(26,58,255,0.25);
  padding: 2px 7px;
  border-radius: 2px;
}

.book-toggle {
  font-size: 18px;
  color: #ccc;
  flex-shrink: 0;
  transition: transform 0.3s ease, color 0.2s;
  line-height: 1;
  padding-top: 2px;
}
.book-item.open .book-toggle {
  transform: rotate(45deg);
  color: var(--primary);
}

/* ─── REVIEW CONTENT ──────────────────────────────────────── */
.book-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.35s ease;
}
.book-item.open .book-body {
  grid-template-rows: 1fr;
}

.book-body-inner {
  overflow: hidden;
}

.book-review {
  padding: 0 16px 32px calc(16px + 24px + 24px);
  font-size: 13px;
  line-height: 1.8;
  color: #333;
  letter-spacing: 0.02em;
}

@media (min-width: 640px) {
  .book-review { padding-left: calc(16px + 40px + 10px); }
}

/* Markdown styles inside review */
.book-review h2 {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #aaa;
  margin: 28px 0 12px;
}
.book-review h2:first-child { margin-top: 0; }

.book-review h3 {
  font-size: 13px;
  font-weight: 500;
  color: #555;
  margin: 20px 0 8px;
}

.book-review p { margin-bottom: 14px; }
.book-review p:last-child { margin-bottom: 0; }

.book-review blockquote {
  border-left: 2px solid var(--primary);
  padding-left: 16px;
  margin: 20px 0;
  color: #666;
  font-style: italic;
}

.book-review ul, .book-review ol {
  padding-left: 18px;
  margin-bottom: 14px;
}
.book-review li { margin-bottom: 4px; }

.book-review strong { font-weight: 500; color: #1a1a1a; }
.book-review em { font-style: italic; }

.book-review hr {
  border: none;
  border-top: 1px solid #e2e0db;
  margin: 24px 0;
}

/* ─── EMPTY STATE ─────────────────────────────────────────── */
.empty {
  padding: 60px 16px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #ccc;
}

/* ─── FOOTER ──────────────────────────────────────────────── */
.page-footer {
  background: var(--dark);
  padding: 40px 24px;
  text-align: center;
}
.page-footer a {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  text-decoration: none;
  transition: color 0.15s;
}
.page-footer a:hover { color: rgba(255,255,255,0.7); }
</style>
</head>
<body>

<!-- ── NAV ─────────────────────────────────────────────────── -->
<nav class="nav">
  <a class="nav-back" href="/">
    <span class="nav-back-arrow">←</span>
    Blue Chord Tape
  </a>
  <span class="nav-title">Reading</span>
</nav>

<!-- ── HEADER ──────────────────────────────────────────────── -->
<header class="page-header">
  <span class="page-label">— Reading —</span>
  <h1 class="page-title">Books</h1>
  <p class="page-desc">읽은 책들과 그에 대한 단상.</p>
</header>

<!-- ── BOOK LIST ───────────────────────────────────────────── -->
<main class="book-list">
  <div class="list-divider"></div>
  <div id="book-list"></div>
</main>

<!-- ── FOOTER ──────────────────────────────────────────────── -->
<footer class="page-footer">
  <a href="/">← Blue Chord Tape</a>
</footer>

<script>
/* ─────────────────────────────────────────────────────────────
   BOOKS DATA
   새 책을 추가하려면 아래 배열에 항목을 추가하세요.
   review 필드는 마크다운을 지원합니다.
───────────────────────────────────────────────────────────── */
const BOOKS = [
  {
    title: "The Creative Act: A Way of Being",
    author: "Rick Rubin",
    date: "2025 · 03",
    tags: ["creativity"],
    review: `## 한 줄 감상

창작이란 무언가를 만드는 것이 아니라, 이미 존재하는 것을 발견하는 행위라는 생각.

## 인상 깊은 구절

> We are all antennae for creative energy. The more we pay attention, the more we can receive.

## 메모

- 결과물보다 과정에 집중하라는 메시지가 계속 반복된다
- 루빈이 말하는 "자연과의 연결"이 처음엔 추상적으로 느껴졌지만, 읽다 보면 구체적인 실천으로 이어짐
- 음악 작업을 할 때의 태도를 다시 생각하게 됐다

**결론적으로** — 뮤지션이라면 한 번쯤 읽어볼 만한 책.`,
  },
];

/* ─────────────────────────────────────────────────────────────
   RENDER
───────────────────────────────────────────────────────────── */
const list = document.getElementById('book-list');

if (!BOOKS.length) {
  list.innerHTML = '<div class="empty">아직 기록된 책이 없습니다</div>';
} else {
  BOOKS.forEach((book, i) => {
    const item = document.createElement('div');
    item.className = 'book-item';

    const tags = (book.tags || []).map(t =>
      `<span class="book-tag">${t}</span>`
    ).join('');

    item.innerHTML = `
      <div class="book-header">
        <div class="book-left">
          <span class="book-num">${String(i + 1).padStart(3, '0')}</span>
          <div class="book-meta">
            <div class="book-title">${book.title}</div>
            <div class="book-info">
              <span class="book-author">${book.author}</span>
              <span class="book-date">${book.date}</span>
              ${tags}
            </div>
          </div>
        </div>
        <span class="book-toggle">+</span>
      </div>
      <div class="book-body">
        <div class="book-body-inner">
          <div class="book-review"></div>
        </div>
      </div>
    `;

    item.querySelector('.book-review').innerHTML =
      marked.parse(book.review || '');

    item.querySelector('.book-header').addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      // close all
      document.querySelectorAll('.book-item.open').forEach(el => el.classList.remove('open'));
      if (!isOpen) item.classList.add('open');
    });

    list.appendChild(item);
  });
}
</script>

</body>
</html>
