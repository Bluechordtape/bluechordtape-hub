<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reading — Blue Chord Tape</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #07111e;
  --bg2:     #0d1929;
  --text:    #ddd8d0;
  --muted:   rgba(221,216,208,0.45);
  --dim:     rgba(221,216,208,0.2);
  --primary: #1a3aff;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Public Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
body.no-scroll { overflow: hidden; }

/* ── NAV ──────────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(7,17,30,0.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  height: 52px; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-back {
  display: flex; align-items: center; gap: 8px;
  text-decoration: none; color: var(--muted);
  font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
  transition: color 0.15s;
}
.nav-back:hover { color: var(--text); }
.nav-back-arrow { color: var(--primary); }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }

.admin-badge {
  display: none; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--primary); border: 1px solid rgba(26,58,255,0.35); padding: 2px 7px;
}
.is-admin .admin-badge { display: inline-block; }

.btn-logout {
  display: none; font-family: inherit; font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--dim); background: none; border: none;
  cursor: pointer; padding: 0; transition: color 0.15s;
}
.btn-logout:hover { color: var(--muted); }
.is-admin .btn-logout { display: inline-block; }

.lock-btn {
  background: none; border: none; cursor: pointer;
  font-size: 14px; opacity: 0.25; transition: opacity 0.15s; padding: 0; line-height: 1;
}
.lock-btn:hover { opacity: 0.6; }
.is-admin .lock-btn { opacity: 1; }

/* ── VIEW ANIMATION ───────────────────────────────────────── */
@keyframes viewIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: viewIn 0.22s ease; }

/* ── LIST VIEW ────────────────────────────────────────────── */
#view-list {
  max-width: 680px; margin: 0 auto; padding: 64px 24px 120px;
}
#view-reading { display: none; max-width: 640px; margin: 0 auto; padding: 48px 24px 120px; }

.list-header { margin-bottom: 52px; }
.list-title {
  font-size: clamp(2rem, 6vw, 3rem); font-weight: 700;
  letter-spacing: -0.025em; line-height: 0.95;
  color: var(--text); margin-bottom: 10px;
}
.list-desc { font-size: 12px; color: var(--muted); letter-spacing: 0.03em; }

.btn-new-book {
  display: none; font-family: inherit; font-size: 10px; letter-spacing: 0.25em;
  text-transform: uppercase; color: var(--primary);
  border: 1px solid rgba(26,58,255,0.3); background: transparent;
  padding: 6px 14px; cursor: pointer; transition: background 0.15s, color 0.15s;
  margin-bottom: 36px;
}
.btn-new-book:hover { background: var(--primary); color: #fff; }
.is-admin .btn-new-book { display: inline-block; }

/* Book items */
.book-item { padding: 28px 0; border-bottom: 1px solid var(--border); }
.book-item:first-child { border-top: 1px solid var(--border); }
.book-item-inner { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }

.book-click { flex: 1; min-width: 0; cursor: pointer; }
.book-title {
  font-size: clamp(15px, 2.2vw, 17px); font-weight: 400;
  letter-spacing: -0.01em; color: var(--text); line-height: 1.3;
  margin-bottom: 5px; transition: color 0.15s;
}
.book-item:hover .book-title { color: var(--primary); }
.book-byline { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; margin-bottom: 4px; }
.book-read-date { font-size: 11px; color: var(--dim); letter-spacing: 0.04em; margin-bottom: 8px; }
.book-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.tag {
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--dim); border: 1px solid var(--border); padding: 2px 7px;
}
.draft-badge {
  display: none; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: #e08a00; border: 1px solid rgba(224,138,0,0.25); padding: 2px 6px;
}
.is-admin .draft-badge { display: inline-block; }

.book-admin-col {
  display: none; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0;
}
.is-admin .book-admin-col { display: flex; }
.btn-adm {
  font-family: inherit; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  background: none; border: none; cursor: pointer; padding: 2px 0; white-space: nowrap;
  transition: opacity 0.15s;
}
.btn-adm-edit   { color: rgba(26,58,255,0.6); }
.btn-adm-status { color: var(--dim); }
.btn-adm-del    { color: rgba(204,68,68,0.6); }
.btn-adm:hover { opacity: 1 !important; }
.btn-adm-edit:hover   { color: var(--primary); }
.btn-adm-status:hover { color: var(--muted); }
.btn-adm-del:hover    { color: #cc4444; }

.list-empty { font-size: 12px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; padding: 48px 0; }

/* ── READING VIEW ─────────────────────────────────────────── */
.reading-nav {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 52px;
}
.btn-back-list {
  font-family: inherit; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted); background: none; border: none; cursor: pointer; padding: 0;
  display: flex; align-items: center; gap: 8px; transition: color 0.15s;
}
.btn-back-list:hover { color: var(--text); }
.btn-back-list .arr { color: var(--primary); }
.btn-edit-current {
  display: none; font-family: inherit; font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--dim); background: none; border: none;
  cursor: pointer; padding: 0; transition: color 0.15s;
}
.btn-edit-current:hover { color: var(--text); }
.is-admin .btn-edit-current { display: inline-block; }

.reading-hero { margin-bottom: 44px; }
.reading-title {
  font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 700;
  letter-spacing: -0.025em; line-height: 1.1; color: var(--text); margin-bottom: 14px;
}
.reading-author { font-size: 14px; color: var(--muted); letter-spacing: 0.02em; margin-bottom: 10px; }
.reading-meta-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
}
.reading-year, .reading-date-read { font-size: 11px; color: var(--dim); letter-spacing: 0.06em; }
.reading-sep { font-size: 11px; color: var(--border2); }
.reading-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.reading-divider { width: 28px; height: 1px; background: var(--border2); margin: 32px 0; }

/* Markdown review */
.review-body { font-size: 14px; line-height: 1.85; color: rgba(221,216,208,0.72); letter-spacing: 0.015em; }
.review-body h2 {
  font-size: 10px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--dim); margin: 36px 0 14px;
}
.review-body h2:first-child { margin-top: 0; }
.review-body h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 24px 0 10px; }
.review-body p { margin-bottom: 16px; }
.review-body p:last-child { margin-bottom: 0; }
.review-body blockquote {
  border-left: 2px solid rgba(26,58,255,0.45); padding-left: 18px;
  margin: 24px 0; color: var(--muted); font-style: italic;
}
.review-body ul, .review-body ol { padding-left: 20px; margin-bottom: 16px; }
.review-body li { margin-bottom: 6px; }
.review-body strong { font-weight: 500; color: var(--text); }
.review-body em { font-style: italic; }
.review-body hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
.review-body code {
  font-family: 'Menlo','Monaco',monospace; font-size: 12px;
  background: var(--bg2); padding: 2px 6px; color: var(--muted);
}

/* ── COMMENTS ─────────────────────────────────────────────── */
.comments-section { margin-top: 72px; padding-top: 40px; border-top: 1px solid var(--border); }
.comments-heading {
  font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--dim);
  margin-bottom: 32px; display: flex; align-items: center; gap: 10px;
}
.comments-count { color: rgba(26,58,255,0.55); }

/* Comment write form */
.cform { margin-bottom: 48px; }
.cform-field { margin-bottom: 0; }
.cform-field + .cform-field { margin-top: 0; }
.c-input, .c-textarea {
  display: block; width: 100%; font-family: inherit; font-size: 13px;
  color: var(--text); background: transparent; border: none;
  border-bottom: 1px solid var(--border2); padding: 11px 0;
  outline: none; transition: border-color 0.15s;
}
.c-input::placeholder, .c-textarea::placeholder { color: var(--dim); }
.c-input:focus, .c-textarea:focus { border-bottom-color: rgba(26,58,255,0.5); }
.c-input { margin-bottom: 0; }
.c-textarea { resize: none; line-height: 1.6; min-height: 50px; overflow: hidden; }
.cform-footer {
  display: flex; align-items: center; justify-content: space-between; padding-top: 12px;
}
.c-error { font-size: 11px; color: #cc4444; min-height: 16px; }
.btn-post {
  font-family: inherit; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--primary); border: 1px solid rgba(26,58,255,0.3); background: transparent;
  padding: 7px 16px; cursor: pointer; flex-shrink: 0; transition: background 0.15s, color 0.15s;
}
.btn-post:hover { background: var(--primary); color: #fff; }
.btn-post:disabled { opacity: 0.35; cursor: default; background: none; }

/* Comment items */
.comment-list { display: flex; flex-direction: column; }
.comment { padding: 20px 0; border-bottom: 1px solid var(--border); }
.comment:last-child { border-bottom: none; }
.comment-hdr {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; margin-bottom: 7px;
}
.comment-author { font-size: 12px; font-weight: 500; color: var(--text); letter-spacing: 0.02em; }
.comment-right { display: flex; align-items: center; gap: 12px; }
.comment-time { font-size: 10px; color: var(--dim); letter-spacing: 0.04em; white-space: nowrap; }
.btn-del-c {
  display: none; font-family: inherit; font-size: 10px; letter-spacing: 0.15em;
  text-transform: uppercase; background: none; border: none;
  color: rgba(204,68,68,0.45); cursor: pointer; padding: 0; transition: color 0.15s;
}
.btn-del-c:hover { color: #cc4444; }
.is-admin .btn-del-c { display: inline-block; }
.comment-body {
  font-size: 13px; line-height: 1.7; color: rgba(221,216,208,0.62);
  white-space: pre-wrap; word-break: break-word; margin-bottom: 8px;
}
.btn-reply-toggle {
  font-family: inherit; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  background: none; border: none; color: var(--dim); cursor: pointer; padding: 0;
  transition: color 0.15s;
}
.btn-reply-toggle:hover { color: var(--muted); }

/* Replies */
.comment-replies { margin-top: 8px; padding-left: 16px; border-left: 1px solid var(--border); }
.reply { padding: 14px 0; border-bottom: 1px solid var(--border); }
.reply:first-child { padding-top: 8px; }
.reply:last-child { border-bottom: none; }
.reply-form-wrap { margin-top: 8px; }

.comments-empty { font-size: 12px; color: var(--dim); letter-spacing: 0.04em; padding: 4px 0 20px; }

/* ── OVERLAY / MODALS ─────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.overlay.open { opacity: 1; pointer-events: all; }

.auth-card {
  background: var(--bg2); border: 1px solid var(--border2);
  padding: 36px 32px; width: 100%; max-width: 320px; margin: 0 16px;
  transform: translateY(10px); transition: transform 0.25s;
}
.overlay.open .auth-card { transform: none; }
.auth-lbl { display: block; font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--dim); margin-bottom: 20px; }
.auth-in {
  width: 100%; font-family: inherit; font-size: 14px; color: var(--text);
  background: transparent; border: none; border-bottom: 1px solid var(--border2);
  padding: 8px 0; outline: none; transition: border-color 0.15s;
}
.auth-in:focus { border-bottom-color: var(--primary); }
.auth-err { font-size: 11px; color: #cc4444; margin-top: 8px; display: none; }
.auth-err.show { display: block; }
.auth-hint { font-size: 10px; color: var(--dim); margin-top: 10px; letter-spacing: 0.04em; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-6px); }
  75%      { transform: translateX(6px); }
}
.shake { animation: shake 0.3s ease; }

/* Book edit modal */
.bmodal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 20px; overflow-y: auto;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.bmodal-overlay.open { opacity: 1; pointer-events: all; }
.bmodal-card {
  background: var(--bg2); border: 1px solid var(--border2);
  width: 100%; max-width: 660px; margin: auto;
  display: flex; flex-direction: column;
  transform: translateY(12px); transition: transform 0.25s;
}
.bmodal-overlay.open .bmodal-card { transform: none; }

.modal-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
}
.modal-hdr-lbl { font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--dim); }
.modal-x-btn {
  background: none; border: none; cursor: pointer; font-size: 20px;
  color: var(--dim); line-height: 1; padding: 0; font-family: inherit; transition: color 0.15s;
}
.modal-x-btn:hover { color: var(--text); }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 18px 24px; border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: flex-end; gap: 14px;
}

.field { margin-bottom: 22px; }
.field-row { display: flex; gap: 20px; }
.field-row .field { flex: 1; }
.field-lbl { display: block; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.f-in {
  display: block; width: 100%; font-family: inherit; font-size: 14px;
  color: var(--text); background: transparent; border: none;
  border-bottom: 1px solid var(--border2); padding: 6px 0; outline: none;
  transition: border-color 0.15s; -webkit-appearance: none; border-radius: 0;
}
.f-in:focus { border-bottom-color: var(--primary); }
.f-in::placeholder { color: var(--dim); }
.field-err { font-size: 11px; color: #cc4444; margin-top: 5px; display: none; }
.field-err.show { display: block; }

input[type="date"].f-in { font-size: 13px; color: var(--muted); }

.status-toggle { display: inline-flex; border: 1px solid var(--border2); overflow: hidden; }
.status-btn {
  font-family: inherit; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 6px 16px; border: none; background: transparent; color: var(--dim);
  cursor: pointer; transition: background 0.15s, color 0.15s;
}
.status-btn.active { background: var(--primary); color: #fff; }

.editor-tabs { display: flex; border-bottom: 1px solid var(--border); }
.editor-tab {
  font-family: inherit; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 8px 14px; background: none; border: none; border-bottom: 2px solid transparent;
  cursor: pointer; color: var(--dim); margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;
}
.editor-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.f-textarea {
  display: block; width: 100%; min-height: 260px;
  font-family: 'Menlo','Monaco',monospace; font-size: 12px; line-height: 1.7;
  color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-top: none; padding: 14px; outline: none; resize: vertical;
  transition: border-color 0.15s;
}
.f-textarea:focus { border-color: rgba(26,58,255,0.4); }
.f-textarea.hidden { display: none; }

.editor-preview {
  display: none; min-height: 260px; border: 1px solid var(--border);
  border-top: none; padding: 16px;
  font-size: 13px; line-height: 1.8; color: rgba(221,216,208,0.7);
}
.editor-preview.show { display: block; }
.editor-preview h2 { font-size: 10px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: var(--dim); margin: 28px 0 12px; }
.editor-preview h2:first-child { margin-top: 0; }
.editor-preview p { margin-bottom: 14px; }
.editor-preview blockquote { border-left: 2px solid rgba(26,58,255,0.4); padding-left: 16px; margin: 20px 0; color: var(--muted); font-style: italic; }
.editor-preview ul, .editor-preview ol { padding-left: 18px; margin-bottom: 14px; }
.editor-preview strong { font-weight: 500; color: var(--text); }

.btn-modal-cancel {
  font-family: inherit; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  background: none; border: none; color: var(--dim); cursor: pointer; padding: 8px 12px;
  transition: color 0.15s;
}
.btn-modal-cancel:hover { color: var(--text); }
.btn-modal-save {
  font-family: inherit; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  background: var(--primary); color: #fff; border: none; padding: 10px 22px;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-modal-save:hover { opacity: 0.85; }

/* ── RESPONSIVE ───────────────────────────────────────────── */
@media (max-width: 480px) {
  #view-list, #view-reading { padding-left: 18px; padding-right: 18px; }
  .field-row { flex-direction: column; gap: 0; }
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-back" href="/"><span class="nav-back-arrow">←</span> Blue Chord Tape</a>
  <div class="nav-right">
    <span class="admin-badge">Admin</span>
    <button class="btn-logout" id="btn-logout">Logout</button>
    <span class="nav-label">Reading</span>
    <button class="lock-btn" id="btn-lock" title="Admin">🔒</button>
  </div>
</nav>

<!-- ── LIST VIEW ───────────────────────────────────────────── -->
<div id="view-list">
  <div class="list-header">
    <h1 class="list-title">Reading</h1>
    <p class="list-desc">읽은 책들의 기록.</p>
  </div>
  <button class="btn-new-book" id="btn-new-book">+ New Book</button>
  <div id="book-list"></div>
</div>

<!-- ── READING VIEW ────────────────────────────────────────── -->
<div id="view-reading">
  <div class="reading-nav">
    <button class="btn-back-list" id="btn-back"><span class="arr">←</span> Reading</button>
    <button class="btn-edit-current" id="btn-edit-current">Edit</button>
  </div>
  <div id="reading-content"></div>
  <div class="comments-section" id="comments-section"></div>
</div>

<!-- ── AUTH MODAL ──────────────────────────────────────────── -->
<div class="overlay" id="auth-overlay">
  <div class="auth-card">
    <span class="auth-lbl">Admin Access</span>
    <input class="auth-in" id="auth-in" type="password" placeholder="Password" autocomplete="current-password"/>
    <div class="auth-err" id="auth-err">잘못된 비밀번호</div>
    <div class="auth-hint">Enter to submit · Esc to close</div>
  </div>
</div>

<!-- ── BOOK EDIT MODAL ─────────────────────────────────────── -->
<div class="bmodal-overlay" id="bmodal">
  <div class="bmodal-card">
    <div class="modal-hdr">
      <span class="modal-hdr-lbl" id="modal-lbl">New Book</span>
      <button class="modal-x-btn" id="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-lbl" for="f-title">Title</label>
        <input class="f-in" id="f-title" type="text" placeholder="Book title" autocomplete="off"/>
        <div class="field-err" id="err-title">제목을 입력하세요</div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-lbl" for="f-author">Author</label>
          <input class="f-in" id="f-author" type="text" placeholder="Author" autocomplete="off"/>
          <div class="field-err" id="err-author">저자를 입력하세요</div>
        </div>
        <div class="field">
          <label class="field-lbl" for="f-year">Publication Year</label>
          <input class="f-in" id="f-year" type="text" placeholder="2024" maxlength="4"/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-lbl" for="f-date">Date Read</label>
          <input class="f-in" id="f-date" type="date"/>
        </div>
        <div class="field">
          <label class="field-lbl" for="f-tags">Tags</label>
          <input class="f-in" id="f-tags" type="text" placeholder="fiction, essay" autocomplete="off"/>
        </div>
      </div>
      <div class="field">
        <label class="field-lbl">Status</label>
        <div class="status-toggle">
          <button class="status-btn active" id="s-pub">Published</button>
          <button class="status-btn" id="s-dft">Draft</button>
        </div>
      </div>
      <div class="field">
        <label class="field-lbl">Review</label>
        <div class="editor-tabs">
          <button class="editor-tab active" id="tab-w">Write</button>
          <button class="editor-tab" id="tab-p">Preview</button>
        </div>
        <textarea class="f-textarea" id="f-review" placeholder="마크다운으로 리뷰를 작성하세요..." spellcheck="false"></textarea>
        <div class="editor-preview" id="ep"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-modal-save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
/* ── CONFIG ───────────────────────────────────────────────── */
// 비밀번호를 여기서 변경하세요
const ADMIN_PASSWORD = 'bluechord2025';

const LS_BOOKS    = 'bct_books_v3';
const LS_COMMENTS = 'bct_comments_v3';
const SS_ADMIN    = 'bct_admin';

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── DEFAULT DATA ─────────────────────────────────────────── */
const DEFAULT_BOOKS = [
  {
    id: 'b001', title: 'The Creative Act: A Way of Being', author: 'Rick Rubin',
    year: '2022', dateRead: '2025-01-10', tags: ['creativity'], status: 'published',
    review: `## 한 줄 감상\n\n창작이란 무언가를 만드는 것이 아니라, 이미 존재하는 것을 발견하는 행위라는 생각.\n\n## 인상 깊은 구절\n\n> We are all antennae for creative energy. The more we pay attention, the more we can receive.\n\n## 메모\n\n- 결과물보다 과정에 집중하라는 메시지가 반복된다\n- 음악 작업을 할 때의 태도를 다시 생각하게 됐다\n\n**결론적으로** — 뮤지션이라면 한 번쯤 읽어볼 만한 책.`,
    createdAt: '2025-01-10T00:00:00.000Z', updatedAt: '2025-01-10T00:00:00.000Z',
  },
  {
    id: 'b002', title: 'Norwegian Wood', author: 'Haruki Murakami',
    year: '1987', dateRead: '2025-02-14', tags: ['fiction', 'novel'], status: 'published',
    review: `## 한 줄 감상\n\n상실과 기억, 그리고 살아남는 것에 대한 이야기.\n\n## 인상 깊은 구절\n\n> 죽음은 삶의 대극에 있는 것이 아니라, 삶 속에 내재해 있다.\n\n## 메모\n\n- 무라카미의 문장은 느리고 고요하다. 읽는 내내 이어폰을 빼게 된다\n- 와타나베의 방황이 지금의 내 상태와 겹쳐 보였다`,
    createdAt: '2025-02-14T00:00:00.000Z', updatedAt: '2025-02-14T00:00:00.000Z',
  },
  {
    id: 'b003', title: 'Meditations', author: 'Marcus Aurelius',
    year: '180', dateRead: '2025-03-01', tags: ['philosophy', 'classics'], status: 'draft',
    review: `## 메모\n\n아직 정리 중.`,
    createdAt: '2025-03-01T00:00:00.000Z', updatedAt: '2025-03-01T00:00:00.000Z',
  },
];

/* ── STATE ────────────────────────────────────────────────── */
let books = [], comments = [];
let isAdmin = false, editingId = null, currentBookId = null, curStatus = 'published';

/* ── HELPERS ──────────────────────────────────────────────── */
function fmtDate(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  if (p.length < 3) return iso;
  return `${MONTHS[+p[1]-1]} ${+p[2]}. ${p[0]}`;
}
function todayISO() { return new Date().toISOString().slice(0,10); }
function genId() {
  return (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtAge(ts) {
  const d = (Date.now() - ts) / 1000;
  if (d < 60)       return 'just now';
  if (d < 3600)     return Math.floor(d/60) + 'm ago';
  if (d < 86400)    return Math.floor(d/3600) + 'h ago';
  if (d < 86400*7)  return Math.floor(d/86400) + 'd ago';
  const dt = new Date(ts);
  return `${MONTHS[dt.getMonth()]} ${dt.getDate()}. ${dt.getFullYear()}`;
}

/* ── DATA ─────────────────────────────────────────────────── */
function loadBooks() {
  try { const r = localStorage.getItem(LS_BOOKS); if (r) { books = JSON.parse(r); return; } } catch(e) {}
  books = JSON.parse(JSON.stringify(DEFAULT_BOOKS));
}
function saveBooks() {
  try { localStorage.setItem(LS_BOOKS, JSON.stringify(books)); } catch(e) {}
}
function loadComments() {
  try { const r = localStorage.getItem(LS_COMMENTS); if (r) { comments = JSON.parse(r); return; } } catch(e) {}
  comments = [];
}
function saveComments() {
  try { localStorage.setItem(LS_COMMENTS, JSON.stringify(comments)); } catch(e) {}
}

/* ── VIEWS ────────────────────────────────────────────────── */
function showView(id) {
  const ids = ['view-list', 'view-reading'];
  ids.forEach(v => { document.getElementById(v).style.display = v === id ? 'block' : 'none'; });
  const el = document.getElementById(id);
  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
}

function goList() {
  currentBookId = null;
  renderList();
  showView('view-list');
}

function goReading(bookId) {
  currentBookId = bookId;
  renderReading(bookId);
  showView('view-reading');
  window.scrollTo(0, 0);
}

/* ── RENDER LIST ──────────────────────────────────────────── */
function renderList() {
  const el = document.getElementById('book-list');
  const visible = isAdmin ? books : books.filter(b => b.status === 'published');

  if (!visible.length) {
    el.innerHTML = '<div class="list-empty">아직 기록된 책이 없습니다</div>';
    return;
  }

  el.innerHTML = '';
  visible.forEach(book => {
    const item = document.createElement('div');
    item.className = 'book-item';
    const tagsHtml = (book.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const draftHtml = book.status === 'draft' ? '<span class="draft-badge">Draft</span>' : '';

    item.innerHTML = `
      <div class="book-item-inner">
        <div class="book-click">
          <div class="book-title">${esc(book.title)} ${draftHtml}</div>
          <div class="book-byline">${esc(book.author)}${book.year ? ' · ' + esc(book.year) : ''}</div>
          ${book.dateRead ? `<div class="book-read-date">Read ${esc(fmtDate(book.dateRead))}</div>` : ''}
          ${tagsHtml ? `<div class="book-tags">${tagsHtml}</div>` : ''}
        </div>
        <div class="book-admin-col">
          <button class="btn-adm btn-adm-edit">Edit</button>
          <button class="btn-adm btn-adm-status">${book.status === 'published' ? 'Unpublish' : 'Publish'}</button>
          <button class="btn-adm btn-adm-del">Delete</button>
        </div>
      </div>`;

    item.querySelector('.book-click').addEventListener('click', () => goReading(book.id));
    item.querySelector('.btn-adm-edit').addEventListener('click', e => { e.stopPropagation(); openBModal(book.id); });
    item.querySelector('.btn-adm-status').addEventListener('click', e => {
      e.stopPropagation();
      const b = books.find(x => x.id === book.id);
      if (b) { b.status = b.status === 'published' ? 'draft' : 'published'; b.updatedAt = new Date().toISOString(); saveBooks(); renderList(); }
    });
    item.querySelector('.btn-adm-del').addEventListener('click', e => {
      e.stopPropagation();
      if (confirm(`"${book.title}"을(를) 삭제하시겠습니까?`)) {
        books = books.filter(b => b.id !== book.id);
        saveBooks(); renderList();
      }
    });
    el.appendChild(item);
  });
}

/* ── RENDER READING ───────────────────────────────────────── */
function renderReading(bookId) {
  const book = books.find(b => b.id === bookId);
  if (!book) { goList(); return; }

  const tagsHtml = (book.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  document.getElementById('reading-content').innerHTML = `
    <div class="reading-hero">
      <h1 class="reading-title">${esc(book.title)}</h1>
      <div class="reading-author">${esc(book.author)}</div>
      <div class="reading-meta-row">
        ${book.year ? `<span class="reading-year">${esc(book.year)}</span>` : ''}
        ${book.year && book.dateRead ? `<span class="reading-sep">·</span>` : ''}
        ${book.dateRead ? `<span class="reading-date-read">Read ${esc(fmtDate(book.dateRead))}</span>` : ''}
      </div>
      ${tagsHtml ? `<div class="reading-tags">${tagsHtml}</div>` : ''}
    </div>
    <div class="reading-divider"></div>
    <div class="review-body">${book.review ? marked.parse(book.review) : '<p style="color:var(--dim)">리뷰가 없습니다.</p>'}</div>`;

  renderComments(bookId);
}

/* ── RENDER COMMENTS ──────────────────────────────────────── */
function renderComments(bookId) {
  const sec = document.getElementById('comments-section');
  const bc  = comments.filter(c => c.bookId === bookId);
  const top = bc.filter(c => !c.parentId);
  const cnt = bc.length;

  sec.innerHTML = `
    <div class="comments-heading">
      Comments ${cnt ? `<span class="comments-count">${cnt}</span>` : ''}
    </div>
    <div class="cform" id="main-cform">
      <div class="cform-field">
        <input class="c-input" id="cn" type="text" placeholder="Name" value="${esc(localStorage.getItem('bct_cn')||'')}" maxlength="40"/>
      </div>
      <div class="cform-field">
        <textarea class="c-textarea" id="ct" placeholder="Leave a comment..." rows="2" maxlength="2000"></textarea>
      </div>
      <div class="cform-footer">
        <span class="c-error" id="ce"></span>
        <button class="btn-post" id="btn-post-main">Post</button>
      </div>
    </div>
    <div class="comment-list" id="clist">
      ${top.length ? top.map(c => commentHTML(c, bc)).join('') : '<div class="comments-empty">첫 번째 댓글을 남겨보세요.</div>'}
    </div>`;

  autoResize(sec.querySelector('#ct'));
  sec.querySelector('#btn-post-main').addEventListener('click', () => postComment(bookId, null));
  wireComments(sec, bookId);
}

function commentHTML(c, allInBook) {
  const replies = allInBook.filter(r => r.parentId === c.id);
  const repliesHtml = replies.map(r => `
    <div class="reply" data-cid="${esc(r.id)}">
      <div class="comment-hdr">
        <span class="comment-author">${esc(r.author)}</span>
        <div class="comment-right">
          <span class="comment-time">${fmtAge(r.createdAt)}</span>
          <button class="btn-del-c" data-id="${esc(r.id)}">Delete</button>
        </div>
      </div>
      <div class="comment-body">${esc(r.content)}</div>
    </div>`).join('');

  return `
    <div class="comment" data-cid="${esc(c.id)}">
      <div class="comment-hdr">
        <span class="comment-author">${esc(c.author)}</span>
        <div class="comment-right">
          <span class="comment-time">${fmtAge(c.createdAt)}</span>
          <button class="btn-del-c" data-id="${esc(c.id)}">Delete</button>
        </div>
      </div>
      <div class="comment-body">${esc(c.content)}</div>
      <button class="btn-reply-toggle" data-id="${esc(c.id)}">Reply</button>
      <div class="reply-form-wrap" id="rfw-${esc(c.id)}"></div>
      ${replies.length ? `<div class="comment-replies">${repliesHtml}</div>` : '<div class="comment-replies"></div>'}
    </div>`;
}

function wireComments(container, bookId) {
  container.querySelectorAll('.btn-del-c').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('댓글을 삭제하시겠습니까?')) return;
      const id = btn.dataset.id;
      comments = comments.filter(c => c.id !== id && c.parentId !== id);
      saveComments(); renderComments(bookId);
    });
  });

  container.querySelectorAll('.btn-reply-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const cid = btn.dataset.id;
      const wrap = document.getElementById('rfw-' + cid);
      if (wrap.innerHTML) { wrap.innerHTML = ''; return; }
      const saved = esc(localStorage.getItem('bct_cn') || '');
      wrap.innerHTML = `
        <div class="cform" style="margin-bottom:0;margin-top:12px">
          <div class="cform-field"><input class="c-input rf-name" type="text" placeholder="Name" value="${saved}" maxlength="40"/></div>
          <div class="cform-field"><textarea class="c-textarea rf-text" placeholder="Write a reply..." rows="2" maxlength="2000"></textarea></div>
          <div class="cform-footer">
            <span class="c-error rf-err"></span>
            <div style="display:flex;gap:10px;align-items:center">
              <button class="btn-modal-cancel rf-cancel" style="padding:4px 0">Cancel</button>
              <button class="btn-post rf-post">Post</button>
            </div>
          </div>
        </div>`;
      const rta = wrap.querySelector('.rf-text');
      autoResize(rta); rta.focus();
      wrap.querySelector('.rf-cancel').addEventListener('click', () => { wrap.innerHTML = ''; });
      wrap.querySelector('.rf-post').addEventListener('click', () => {
        const name = wrap.querySelector('.rf-name').value.trim();
        const text = rta.value.trim();
        const err  = wrap.querySelector('.rf-err');
        err.textContent = '';
        if (!name) { err.textContent = '이름을 입력하세요'; return; }
        if (!text) { err.textContent = '내용을 입력하세요'; return; }
        localStorage.setItem('bct_cn', name);
        comments.push({ id: genId(), bookId, parentId: cid, author: name, content: text, createdAt: Date.now() });
        saveComments(); renderComments(bookId);
      });
    });
  });
}

function postComment(bookId, parentId) {
  const nameEl = document.getElementById('cn');
  const textEl = document.getElementById('ct');
  const errEl  = document.getElementById('ce');
  const name = nameEl.value.trim(), text = textEl.value.trim();
  errEl.textContent = '';
  if (!name) { errEl.textContent = '이름을 입력하세요'; nameEl.focus(); return; }
  if (!text) { errEl.textContent = '내용을 입력하세요'; textEl.focus(); return; }
  localStorage.setItem('bct_cn', name);
  comments.push({ id: genId(), bookId, parentId: parentId || null, author: name, content: text, createdAt: Date.now() });
  saveComments(); renderComments(bookId);
}

function autoResize(ta) {
  if (!ta) return;
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
}

/* ── ADMIN ────────────────────────────────────────────────── */
function setAdmin(val) {
  isAdmin = val;
  val ? sessionStorage.setItem(SS_ADMIN,'1') : sessionStorage.removeItem(SS_ADMIN);
  document.body.classList.toggle('is-admin', val);
  currentBookId ? renderReading(currentBookId) : renderList();
}

/* ── AUTH MODAL ───────────────────────────────────────────── */
const authOv = document.getElementById('auth-overlay');
const authIn = document.getElementById('auth-in');
const authEr = document.getElementById('auth-err');

function openAuth() {
  authIn.value = ''; authEr.classList.remove('show');
  authOv.classList.add('open'); document.body.classList.add('no-scroll');
  setTimeout(() => authIn.focus(), 50);
}
function closeAuth() { authOv.classList.remove('open'); document.body.classList.remove('no-scroll'); }
function tryLogin() {
  if (authIn.value.trim() === ADMIN_PASSWORD) { closeAuth(); setAdmin(true); }
  else {
    authEr.classList.add('show');
    authIn.classList.remove('shake'); void authIn.offsetWidth; authIn.classList.add('shake');
    authIn.value = ''; setTimeout(() => authIn.focus(), 10);
  }
}
authIn.addEventListener('keydown', e => { if (e.key==='Enter') tryLogin(); if (e.key==='Escape') closeAuth(); });
authOv.addEventListener('click', e => { if (e.target===authOv) closeAuth(); });
document.getElementById('btn-lock').addEventListener('click', () => { if (!isAdmin) openAuth(); });
document.getElementById('btn-logout').addEventListener('click', () => setAdmin(false));

/* ── BOOK MODAL ───────────────────────────────────────────── */
const bmodal = document.getElementById('bmodal');

function openBModal(id) {
  editingId = id || null;
  ['err-title','err-author'].forEach(x => document.getElementById(x).classList.remove('show'));
  const get = x => document.getElementById(x);

  if (id) {
    const b = books.find(x => x.id === id); if (!b) return;
    get('modal-lbl').textContent = 'Edit Book';
    get('f-title').value  = b.title;
    get('f-author').value = b.author;
    get('f-year').value   = b.year || '';
    get('f-date').value   = b.dateRead || '';
    get('f-tags').value   = (b.tags||[]).join(', ');
    get('f-review').value = b.review || '';
    setStatus(b.status || 'published');
  } else {
    get('modal-lbl').textContent = 'New Book';
    ['f-title','f-author','f-year','f-tags','f-review'].forEach(x => get(x).value = '');
    get('f-date').value = todayISO();
    setStatus('published');
  }
  switchTab('w');
  bmodal.classList.add('open'); document.body.classList.add('no-scroll');
  setTimeout(() => get('f-title').focus(), 50);
}

function closeBModal() {
  bmodal.classList.remove('open'); document.body.classList.remove('no-scroll'); editingId = null;
}

function setStatus(v) {
  curStatus = v;
  document.getElementById('s-pub').classList.toggle('active', v==='published');
  document.getElementById('s-dft').classList.toggle('active', v==='draft');
}

function saveBook() {
  const get = x => document.getElementById(x);
  const title  = get('f-title').value.trim();
  const author = get('f-author').value.trim();
  let ok = true;
  if (!title)  { get('err-title').classList.add('show');  ok = false; } else get('err-title').classList.remove('show');
  if (!author) { get('err-author').classList.add('show'); ok = false; } else get('err-author').classList.remove('show');
  if (!ok) return;

  const now  = new Date().toISOString();
  const tags = get('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const data = { title, author, year: get('f-year').value.trim(), dateRead: get('f-date').value, tags, status: curStatus, review: get('f-review').value, updatedAt: now };

  if (editingId) {
    const idx = books.findIndex(b => b.id === editingId);
    if (idx !== -1) books[idx] = { ...books[idx], ...data };
  } else {
    books.unshift({ id: genId(), ...data, createdAt: now });
  }
  saveBooks(); closeBModal();
  if (editingId && currentBookId === editingId) renderReading(editingId); else renderList();
}

document.getElementById('s-pub').addEventListener('click', () => setStatus('published'));
document.getElementById('s-dft').addEventListener('click', () => setStatus('draft'));
document.getElementById('modal-save').addEventListener('click', saveBook);
document.getElementById('modal-cancel').addEventListener('click', closeBModal);
document.getElementById('modal-close').addEventListener('click', closeBModal);
bmodal.addEventListener('click', e => { if (e.target===bmodal) closeBModal(); });

function switchTab(which) {
  const ta = document.getElementById('f-review');
  const pv = document.getElementById('ep');
  const tw = document.getElementById('tab-w');
  const tp = document.getElementById('tab-p');
  if (which==='w') {
    tw.classList.add('active'); tp.classList.remove('active');
    ta.classList.remove('hidden'); pv.classList.remove('show');
  } else {
    tp.classList.add('active'); tw.classList.remove('active');
    ta.classList.add('hidden');
    pv.innerHTML = ta.value ? marked.parse(ta.value) : '<span style="color:var(--dim);font-size:12px">미리볼 내용이 없습니다</span>';
    pv.classList.add('show');
  }
}
document.getElementById('tab-w').addEventListener('click', () => switchTab('w'));
document.getElementById('tab-p').addEventListener('click', () => switchTab('p'));
document.getElementById('f-review').addEventListener('keydown', e => {
  if (e.key==='Tab') {
    e.preventDefault();
    const s=e.target.selectionStart, en=e.target.selectionEnd;
    e.target.value = e.target.value.slice(0,s)+'  '+e.target.value.slice(en);
    e.target.selectionStart = e.target.selectionEnd = s+2;
  }
});

/* ── GLOBAL SHORTCUTS ─────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key==='Enter' && bmodal.classList.contains('open')) saveBook();
  if (e.key==='Escape') {
    if (bmodal.classList.contains('open')) closeBModal();
    else if (authOv.classList.contains('open')) closeAuth();
  }
});

document.getElementById('btn-back').addEventListener('click', goList);
document.getElementById('btn-edit-current').addEventListener('click', () => { if (currentBookId) openBModal(currentBookId); });
document.getElementById('btn-new-book').addEventListener('click', () => openBModal(null));

/* ── INIT ─────────────────────────────────────────────────── */
loadBooks(); loadComments();
if (sessionStorage.getItem(SS_ADMIN)==='1') { isAdmin=true; document.body.classList.add('is-admin'); }
goList();
</script>
</body>
</html>
