<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books — Blue Chord Tape</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f3ee;color:#1a1a1a;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:80px 32px 120px}
.back{display:inline-block;font-size:11px;letter-spacing:.14em;color:#aaa;text-decoration:none;text-transform:uppercase;margin-bottom:48px;transition:color .2s}
.back:hover{color:#1a1a1a}
.page-title{font-size:11px;letter-spacing:.2em;color:#aaa;text-transform:uppercase;margin-bottom:12px}
h1{font-size:32px;font-weight:700;line-height:1.2;margin-bottom:12px}
.intro{font-size:15px;color:#666;line-height:1.7;margin-bottom:60px}
.book-list{display:flex;flex-direction:column;gap:0}
.book{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:28px 0;border-bottom:1px solid #e5e2dc;cursor:pointer;text-decoration:none;color:inherit;transition:opacity .2s}
.book:first-child{border-top:1px solid #e5e2dc}
.book:hover{opacity:.6}
.book-num{font-size:11px;letter-spacing:.12em;color:#bbb;margin-bottom:8px}
.book-title{font-size:20px;font-weight:700;margin-bottom:6px;line-height:1.3}
.book-author{font-size:13px;color:#888}
.book-arrow{font-size:18px;color:#ccc;flex-shrink:0;margin-top:4px;transition:color .2s}
.book:hover .book-arrow{color:#1a1a1a}
.footer-note{margin-top:48px;font-size:12px;color:#bbb;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="back">← Blue Chord Tape</a>
  <p class="page-title">Reading List</p>
  <h1>추천하는 책들</h1>
  <p class="intro">직접 읽고 좋았던 책들을 모았습니다.<br>한 권씩 천천히, 괜찮으시면 같이 읽어요.</p>

  <div class="book-list">
    <a class="book" href="https://www.yes24.com/product/search?query=기내식+먹는+기분" target="_blank" rel="noopener">
      <div class="book-info">
        <p class="book-num">001</p>
        <p class="book-title">기내식 먹는 기분</p>
        <p class="book-author">정은</p>
      </div>
      <span class="book-arrow">↗</span>
    </a>
    <a class="book" href="https://www.yes24.com/product/search?query=임팩트+플레이어+리즈+와이즈먼" target="_blank" rel="noopener">
      <div class="book-info">
        <p class="book-num">002</p>
        <p class="book-title">임팩트 플레이어</p>
        <p class="book-author">리즈 와이즈먼</p>
      </div>
      <span class="book-arrow">↗</span>
    </a>
    <a class="book" href="https://www.yes24.com/product/search?query=심플하게+산다+도미니크+로로" target="_blank" rel="noopener">
      <div class="book-info">
        <p class="book-num">003</p>
        <p class="book-title">심플하게 산다</p>
        <p class="book-author">도미니크 로로</p>
      </div>
      <span class="book-arrow">↗</span>
    </a>
    <a class="book" href="https://www.yes24.com/product/search?query=일의+감각+조수용" target="_blank" rel="noopener">
      <div class="book-info">
        <p class="book-num">004</p>
        <p class="book-title">일의 감각</p>
        <p class="book-author">조수용</p>
      </div>
      <span class="book-arrow">↗</span>
    </a>
  </div>

  <p class="footer-note">↗ 클릭하면 YES24 검색 페이지로 이동합니다.</p>
</div>
</body>
</html>
