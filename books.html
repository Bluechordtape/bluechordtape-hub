<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reading — Blue Chord Tape</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #1a3aff;
  --warm-white: #F9F7F4;
  --dark: #0e1a2e;
  --border: #e2e0db;
  --text: #1a1a1a;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Public Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--warm-white);
  color: var(--text);
  min-height: 100vh;
}

body.modal-open { overflow: hidden; }

/* ─── NAV ─────────────────────────────────────────────────── */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--warm-white);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-back {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  transition: color 0.15s;
}
.nav-back:hover { color: var(--primary); }
.nav-back-arrow {
  font-size: 16px;
  line-height: 1;
  color: var(--primary);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.nav-title {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #bbb;
}

.admin-badge {
  display: none;
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--primary);
  border: 1px solid rgba(26,58,255,0.3);
  padding: 2px 7px;
  border-radius: 2px;
}
.is-admin .admin-badge { display: inline-block; }

.admin-logout {
  display: none;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #aaa;
  cursor: pointer;
  transition: color 0.15s;
  background: none;
  border: none;
  font-family: inherit;
  padding: 0;
}
.admin-logout:hover { color: var(--text); }
.is-admin .admin-logout { display: inline-block; }

.lock-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 15px;
  opacity: 0.3;
  transition: opacity 0.15s;
  padding: 0;
  line-height: 1;
  display: flex;
  align-items: center;
}
.lock-btn:hover { opacity: 0.7; }
.is-admin .lock-btn { opacity: 1; filter: hue-rotate(0deg) saturate(3); }

/* ─── HEADER ──────────────────────────────────────────────── */
.page-header {
  padding: 64px 24px 48px;
  max-width: 740px;
  margin: 0 auto;
}

.page-label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 16px;
}

.page-title {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  color: #111;
}

.page-desc {
  margin-top: 16px;
  font-size: 13px;
  color: #888;
  letter-spacing: 0.02em;
  line-height: 1.6;
}

/* ─── BOOK LIST ───────────────────────────────────────────── */
.book-list {
  max-width: 740px;
  margin: 0 auto;
  padding: 0 24px 120px;
}

.list-divider {
  width: 100%;
  height: 2px;
  background: var(--primary);
  margin-bottom: 0;
}

.list-actions {
  display: none;
  padding: 16px 0 0;
}
.is-admin .list-actions { display: block; }

.btn-new-book {
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--primary);
  border: 1px solid rgba(26,58,255,0.35);
  background: transparent;
  padding: 7px 14px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  border-radius: 2px;
}
.btn-new-book:hover {
  background: var(--primary);
  color: #fff;
}

.book-item {
  border-bottom: 1px solid var(--border);
}

.book-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 24px 16px;
  cursor: pointer;
  gap: 16px;
  transition: background 0.2s, padding-left 0.2s;
  user-select: none;
}
.book-header:hover {
  background: rgba(26, 58, 255, 0.03);
  padding-left: 24px;
}

.book-left {
  display: flex;
  align-items: flex-start;
  gap: 24px;
  flex: 1;
  min-width: 0;
}

@media (min-width: 640px) {
  .book-left { gap: 40px; }
}

.book-num {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--primary);
  flex-shrink: 0;
  padding-top: 2px;
}

.book-meta { flex: 1; min-width: 0; }

.book-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.book-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.draft-badge {
  display: none;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #e08a00;
  border: 1px solid rgba(224,138,0,0.3);
  padding: 2px 6px;
  border-radius: 2px;
  flex-shrink: 0;
}
.is-admin .draft-badge { display: inline-block; }

.book-info {
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.book-author {
  font-size: 12px;
  color: #888;
  letter-spacing: 0.02em;
}

.book-date {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #bbb;
}

.book-tag {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--primary);
  border: 1px solid rgba(26,58,255,0.25);
  padding: 2px 7px;
  border-radius: 2px;
}

.book-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  padding-top: 2px;
}

.book-admin-btns {
  display: none;
  align-items: center;
  gap: 10px;
}
.is-admin .book-admin-btns { display: flex; }

.btn-edit-book,
.btn-delete-book {
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 0;
  transition: opacity 0.15s;
}
.btn-edit-book { color: var(--primary); }
.btn-delete-book { color: #cc4444; }
.btn-edit-book:hover,
.btn-delete-book:hover { opacity: 0.6; }

.book-toggle {
  font-size: 18px;
  color: #ccc;
  flex-shrink: 0;
  transition: transform 0.3s ease, color 0.2s;
  line-height: 1;
}
.book-item.open .book-toggle {
  transform: rotate(45deg);
  color: var(--primary);
}

/* ─── REVIEW CONTENT ──────────────────────────────────────── */
.book-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.35s ease;
}
.book-item.open .book-body {
  grid-template-rows: 1fr;
}

.book-body-inner {
  overflow: hidden;
}

.book-review {
  padding: 0 16px 32px calc(16px + 24px + 24px);
  font-size: 13px;
  line-height: 1.8;
  color: #333;
  letter-spacing: 0.02em;
}

@media (min-width: 640px) {
  .book-review { padding-left: calc(16px + 40px + 10px); }
}

.book-review h2 {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #aaa;
  margin: 28px 0 12px;
}
.book-review h2:first-child { margin-top: 0; }

.book-review h3 {
  font-size: 13px;
  font-weight: 500;
  color: #555;
  margin: 20px 0 8px;
}

.book-review p { margin-bottom: 14px; }
.book-review p:last-child { margin-bottom: 0; }

.book-review blockquote {
  border-left: 2px solid var(--primary);
  padding-left: 16px;
  margin: 20px 0;
  color: #666;
  font-style: italic;
}

.book-review ul, .book-review ol {
  padding-left: 18px;
  margin-bottom: 14px;
}
.book-review li { margin-bottom: 4px; }

.book-review strong { font-weight: 500; color: var(--text); }
.book-review em { font-style: italic; }

.book-review hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}

/* ─── EMPTY STATE ─────────────────────────────────────────── */
.empty {
  padding: 60px 16px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #ccc;
}

/* ─── FOOTER ──────────────────────────────────────────────── */
.page-footer {
  background: var(--dark);
  padding: 40px 24px;
  text-align: center;
}
.page-footer a {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  text-decoration: none;
  transition: color 0.15s;
}
.page-footer a:hover { color: rgba(255,255,255,0.7); }

/* ─── AUTH MODAL ──────────────────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.overlay.visible {
  opacity: 1;
  pointer-events: all;
}

.auth-card {
  background: #fff;
  padding: 36px 32px 32px;
  width: 100%;
  max-width: 360px;
  margin: 0 16px;
  border-radius: 4px;
  transform: translateY(12px);
  transition: transform 0.25s ease;
}
.overlay.visible .auth-card {
  transform: translateY(0);
}

.auth-title {
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 24px;
}

.auth-input-wrap { position: relative; }

.auth-input {
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: transparent;
  border: none;
  border-bottom: 1px solid #d8d6d2;
  padding: 8px 0;
  outline: none;
  transition: border-color 0.15s;
}
.auth-input:focus { border-bottom-color: var(--primary); }

.auth-error {
  display: none;
  font-size: 11px;
  color: #cc4444;
  margin-top: 8px;
  letter-spacing: 0.05em;
}
.auth-error.visible { display: block; }

.auth-hint {
  font-size: 11px;
  color: #bbb;
  margin-top: 10px;
  letter-spacing: 0.05em;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-6px); }
  40%     { transform: translateX(6px); }
  60%     { transform: translateX(-4px); }
  80%     { transform: translateX(4px); }
}
.shake { animation: shake 0.35s ease; }

/* ─── BOOK MODAL ──────────────────────────────────────────── */
.book-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  padding: 20px;
}
.book-modal-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

.book-modal-card {
  background: #fff;
  width: 100%;
  max-width: 680px;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  transform: translateY(16px);
  transition: transform 0.25s ease;
}
.book-modal-overlay.visible .book-modal-card {
  transform: translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 24px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.modal-title {
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #aaa;
}

.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 22px;
  color: #aaa;
  line-height: 1;
  padding: 0;
  transition: color 0.15s;
  font-family: inherit;
}
.modal-close:hover { color: var(--text); }

.modal-body {
  padding: 24px;
  flex: 1;
  overflow-y: auto;
}

.modal-footer {
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  flex-shrink: 0;
}

/* Form fields */
.field {
  margin-bottom: 24px;
}

.field-label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #999;
  margin-bottom: 8px;
}

.field-input {
  display: block;
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: transparent;
  border: none;
  border-bottom: 1px solid #d8d6d2;
  padding: 6px 0;
  outline: none;
  transition: border-color 0.15s;
  border-radius: 0;
  -webkit-appearance: none;
}
.field-input:focus { border-bottom-color: var(--primary); }
.field-input::placeholder { color: #ccc; }
.field-input[data-large] { font-weight: 500; }

.field-error {
  display: none;
  font-size: 11px;
  color: #cc4444;
  margin-top: 6px;
  letter-spacing: 0.05em;
}
.field-error.visible { display: block; }

/* Date input */
input[type="date"].field-input {
  font-size: 13px;
  color: #666;
}

/* Status toggle */
.status-toggle {
  display: inline-flex;
  border: 1px solid #d8d6d2;
  border-radius: 20px;
  overflow: hidden;
}
.status-btn {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 6px 18px;
  border: none;
  background: transparent;
  color: #aaa;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.status-btn.active {
  background: var(--primary);
  color: #fff;
}

/* Editor tabs */
.editor-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}
.editor-tab {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 8px 14px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  color: #aaa;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}
.editor-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.editor-write { display: block; }
.editor-preview-panel { display: none; }
.editor-write.hidden { display: none; }
.editor-preview-panel.visible { display: block; }

.field-textarea {
  display: block;
  width: 100%;
  min-height: 280px;
  font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  background: transparent;
  border: 1px solid #d8d6d2;
  border-top: none;
  padding: 14px;
  outline: none;
  resize: vertical;
  transition: border-color 0.15s;
}
.field-textarea:focus { border-color: var(--primary); }

.editor-preview-panel {
  min-height: 280px;
  border: 1px solid #d8d6d2;
  border-top: none;
  padding: 14px;
  font-size: 13px;
  line-height: 1.8;
  color: #333;
  letter-spacing: 0.02em;
}

/* reuse book-review styles inside preview */
.editor-preview-panel h2 {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #aaa;
  margin: 28px 0 12px;
}
.editor-preview-panel h2:first-child { margin-top: 0; }
.editor-preview-panel h3 {
  font-size: 13px;
  font-weight: 500;
  color: #555;
  margin: 20px 0 8px;
}
.editor-preview-panel p { margin-bottom: 14px; }
.editor-preview-panel p:last-child { margin-bottom: 0; }
.editor-preview-panel blockquote {
  border-left: 2px solid var(--primary);
  padding-left: 16px;
  margin: 20px 0;
  color: #666;
  font-style: italic;
}
.editor-preview-panel ul, .editor-preview-panel ol {
  padding-left: 18px;
  margin-bottom: 14px;
}
.editor-preview-panel li { margin-bottom: 4px; }
.editor-preview-panel strong { font-weight: 500; color: var(--text); }
.editor-preview-panel em { font-style: italic; }
.editor-preview-panel hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}

/* Buttons */
.btn-cancel {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: none;
  border: none;
  color: #aaa;
  cursor: pointer;
  padding: 8px 12px;
  transition: color 0.15s;
}
.btn-cancel:hover { color: var(--text); }

.btn-save {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 10px 22px;
  cursor: pointer;
  border-radius: 2px;
  transition: opacity 0.15s;
}
.btn-save:hover { opacity: 0.85; }
</style>
</head>
<body>

<!-- ── NAV ─────────────────────────────────────────────────── -->
<nav class="nav">
  <a class="nav-back" href="/">
    <span class="nav-back-arrow">←</span>
    Blue Chord Tape
  </a>
  <div class="nav-right">
    <span class="admin-badge">Admin Mode</span>
    <button class="admin-logout" id="btn-logout" aria-label="Logout">Logout</button>
    <span class="nav-title">Reading</span>
    <button class="lock-btn" id="btn-lock" aria-label="Admin login" title="Admin">🔒</button>
  </div>
</nav>

<!-- ── HEADER ──────────────────────────────────────────────── -->
<header class="page-header">
  <span class="page-label">— Reading —</span>
  <h1 class="page-title">Books</h1>
  <p class="page-desc">읽은 책들과 그에 대한 단상.</p>
</header>

<!-- ── BOOK LIST ───────────────────────────────────────────── -->
<main class="book-list">
  <div class="list-divider"></div>
  <div class="list-actions">
    <button class="btn-new-book" id="btn-new-book">+ New Book</button>
  </div>
  <div id="book-list"></div>
</main>

<!-- ── FOOTER ──────────────────────────────────────────────── -->
<footer class="page-footer">
  <a href="/">← Blue Chord Tape</a>
</footer>

<!-- ── AUTH MODAL ─────────────────────────────────────────── -->
<div class="overlay" id="auth-overlay" role="dialog" aria-modal="true" aria-label="Admin login">
  <div class="auth-card">
    <div class="auth-title">Admin Access</div>
    <div class="auth-input-wrap">
      <input
        class="auth-input"
        id="auth-input"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        spellcheck="false"
      />
    </div>
    <div class="auth-error" id="auth-error">잘못된 비밀번호입니다</div>
    <div class="auth-hint">Enter to submit · Escape to close</div>
  </div>
</div>

<!-- ── BOOK MODAL ─────────────────────────────────────────── -->
<div class="book-modal-overlay" id="book-modal-overlay" role="dialog" aria-modal="true">
  <div class="book-modal-card" id="book-modal-card">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">New Book</span>
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label" for="f-title">Title</label>
        <input class="field-input" id="f-title" type="text" placeholder="Book title" data-large autocomplete="off"/>
        <div class="field-error" id="err-title">제목을 입력하세요</div>
      </div>
      <div class="field">
        <label class="field-label" for="f-author">Author</label>
        <input class="field-input" id="f-author" type="text" placeholder="Author name" autocomplete="off"/>
        <div class="field-error" id="err-author">저자를 입력하세요</div>
      </div>
      <div class="field">
        <label class="field-label" for="f-date">Date</label>
        <input class="field-input" id="f-date" type="date"/>
      </div>
      <div class="field">
        <label class="field-label" for="f-tags">Tags</label>
        <input class="field-input" id="f-tags" type="text" placeholder="fiction, essay, ..." autocomplete="off"/>
      </div>
      <div class="field">
        <label class="field-label">Status</label>
        <div class="status-toggle">
          <button class="status-btn active" id="status-published" data-val="published">Published</button>
          <button class="status-btn" id="status-draft" data-val="draft">Draft</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Review</label>
        <div class="editor-tabs">
          <button class="editor-tab active" id="tab-write">Write</button>
          <button class="editor-tab" id="tab-preview">Preview</button>
        </div>
        <textarea
          class="field-textarea editor-write"
          id="f-review"
          placeholder="마크다운으로 리뷰를 작성하세요..."
          spellcheck="false"
        ></textarea>
        <div class="editor-preview-panel book-review" id="editor-preview"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
/* =============================================================
   비밀번호를 여기서 변경하세요
============================================================= */
const ADMIN_PASSWORD = 'bluechord2025';

/* =============================================================
   DEFAULT BOOKS
============================================================= */
const DEFAULT_BOOKS = [
  {
    id: 'default-001',
    title: 'The Creative Act: A Way of Being',
    author: 'Rick Rubin',
    date: '2025-01-10',
    tags: ['creativity'],
    status: 'published',
    review: `## 한 줄 감상

창작이란 무언가를 만드는 것이 아니라, 이미 존재하는 것을 발견하는 행위라는 생각.

## 인상 깊은 구절

> We are all antennae for creative energy. The more we pay attention, the more we can receive.

## 메모

- 결과물보다 과정에 집중하라는 메시지가 계속 반복된다
- 루빈이 말하는 "자연과의 연결"이 처음엔 추상적으로 느껴졌지만, 읽다 보면 구체적인 실천으로 이어짐
- 음악 작업을 할 때의 태도를 다시 생각하게 됐다

**결론적으로** — 뮤지션이라면 한 번쯤 읽어볼 만한 책.`,
    createdAt: '2025-01-10T00:00:00.000Z',
    updatedAt: '2025-01-10T00:00:00.000Z',
  }
];

/* =============================================================
   STATE
============================================================= */
const LS_KEY = 'bct_books';
const SS_KEY = 'bct_admin';

let books = [];
let isAdmin = false;
let editingId = null; // null = new book, string = editing existing

/* =============================================================
   HELPERS
============================================================= */
function formatDate(iso) {
  // "2025-03-12" → "2025 · 03"
  if (!iso) return '';
  const parts = iso.split('-');
  if (parts.length < 2) return iso;
  return parts[0] + ' · ' + parts[1];
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function genId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return crypto.randomUUID();
  }
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function loadBooks() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length >= 0) {
        books = parsed;
        return;
      }
    }
  } catch (e) { /* ignore */ }
  books = JSON.parse(JSON.stringify(DEFAULT_BOOKS));
}

function saveBooks() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(books));
  } catch (e) { /* ignore */ }
}

/* =============================================================
   RENDER
============================================================= */
function renderList() {
  const list = document.getElementById('book-list');
  const visible = isAdmin
    ? books
    : books.filter(b => b.status === 'published');

  if (!visible.length) {
    list.innerHTML = '<div class="empty">아직 기록된 책이 없습니다</div>';
    return;
  }

  // Keep track of open items to restore state
  const openIds = new Set(
    [...document.querySelectorAll('.book-item.open')]
      .map(el => el.dataset.id)
  );

  list.innerHTML = '';

  visible.forEach((book, i) => {
    const item = document.createElement('div');
    item.className = 'book-item' + (openIds.has(book.id) ? ' open' : '');
    item.dataset.id = book.id;

    const tags = (book.tags || []).map(t =>
      `<span class="book-tag">${escHtml(t.trim())}</span>`
    ).join('');

    const draftLabel = (book.status === 'draft')
      ? `<span class="draft-badge">Draft</span>`
      : '';

    item.innerHTML = `
      <div class="book-header">
        <div class="book-left">
          <span class="book-num">${String(i + 1).padStart(3, '0')}</span>
          <div class="book-meta">
            <div class="book-title-row">
              <span class="book-title">${escHtml(book.title)}</span>
              ${draftLabel}
            </div>
            <div class="book-info">
              <span class="book-author">${escHtml(book.author)}</span>
              <span class="book-date">${escHtml(formatDate(book.date))}</span>
              ${tags}
            </div>
          </div>
        </div>
        <div class="book-right">
          <div class="book-admin-btns">
            <button class="btn-edit-book" data-id="${escHtml(book.id)}">Edit</button>
            <button class="btn-delete-book" data-id="${escHtml(book.id)}">Delete</button>
          </div>
          <span class="book-toggle">+</span>
        </div>
      </div>
      <div class="book-body">
        <div class="book-body-inner">
          <div class="book-review"></div>
        </div>
      </div>
    `;

    item.querySelector('.book-review').innerHTML =
      book.review ? marked.parse(book.review) : '';

    // Accordion toggle — clicking admin buttons should not toggle
    item.querySelector('.book-header').addEventListener('click', (e) => {
      if (e.target.classList.contains('btn-edit-book') ||
          e.target.classList.contains('btn-delete-book')) return;
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.book-item.open').forEach(el => el.classList.remove('open'));
      if (!isOpen) item.classList.add('open');
    });

    // Edit button
    const editBtn = item.querySelector('.btn-edit-book');
    if (editBtn) {
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openBookModal(book.id);
      });
    }

    // Delete button
    const delBtn = item.querySelector('.btn-delete-book');
    if (delBtn) {
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm(`"${book.title}"을(를) 삭제하시겠습니까?`)) {
          books = books.filter(b => b.id !== book.id);
          saveBooks();
          renderList();
        }
      });
    }

    list.appendChild(item);
  });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* =============================================================
   ADMIN SESSION
============================================================= */
function setAdmin(val) {
  isAdmin = val;
  if (val) {
    sessionStorage.setItem(SS_KEY, '1');
    document.body.classList.add('is-admin');
  } else {
    sessionStorage.removeItem(SS_KEY);
    document.body.classList.remove('is-admin');
  }
  renderList();
}

/* =============================================================
   AUTH MODAL
============================================================= */
const authOverlay = document.getElementById('auth-overlay');
const authInput   = document.getElementById('auth-input');
const authError   = document.getElementById('auth-error');

function openAuthModal() {
  authInput.value = '';
  authError.classList.remove('visible');
  authOverlay.classList.add('visible');
  document.body.classList.add('modal-open');
  setTimeout(() => authInput.focus(), 50);
}

function closeAuthModal() {
  authOverlay.classList.remove('visible');
  document.body.classList.remove('modal-open');
}

function tryLogin() {
  const val = authInput.value.trim();
  if (val === ADMIN_PASSWORD) {
    closeAuthModal();
    setAdmin(true);
  } else {
    authError.classList.add('visible');
    authInput.classList.remove('shake');
    void authInput.offsetWidth; // reflow to restart animation
    authInput.classList.add('shake');
    authInput.value = '';
    setTimeout(() => authInput.focus(), 10);
  }
}

authInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryLogin();
  if (e.key === 'Escape') closeAuthModal();
});

authOverlay.addEventListener('click', (e) => {
  if (e.target === authOverlay) closeAuthModal();
});

document.getElementById('btn-lock').addEventListener('click', () => {
  if (isAdmin) {
    // Already admin: do nothing (logout via logout button)
  } else {
    openAuthModal();
  }
});

document.getElementById('btn-logout').addEventListener('click', () => {
  setAdmin(false);
});

/* =============================================================
   BOOK MODAL
============================================================= */
const bookModalOverlay = document.getElementById('book-modal-overlay');
const fTitle    = document.getElementById('f-title');
const fAuthor   = document.getElementById('f-author');
const fDate     = document.getElementById('f-date');
const fTags     = document.getElementById('f-tags');
const fReview   = document.getElementById('f-review');
const errTitle  = document.getElementById('err-title');
const errAuthor = document.getElementById('err-author');
const modalTitleEl = document.getElementById('modal-title');

let currentStatus = 'published';

function openBookModal(id) {
  editingId = id || null;
  errTitle.classList.remove('visible');
  errAuthor.classList.remove('visible');

  if (id) {
    const book = books.find(b => b.id === id);
    if (!book) return;
    modalTitleEl.textContent = 'Edit Book';
    fTitle.value  = book.title;
    fAuthor.value = book.author;
    fDate.value   = book.date || '';
    fTags.value   = (book.tags || []).join(', ');
    fReview.value = book.review || '';
    setStatus(book.status || 'published');
  } else {
    modalTitleEl.textContent = 'New Book';
    fTitle.value  = '';
    fAuthor.value = '';
    fDate.value   = todayISO();
    fTags.value   = '';
    fReview.value = '';
    setStatus('published');
  }

  // Reset editor to Write tab
  switchTab('write');

  bookModalOverlay.classList.add('visible');
  document.body.classList.add('modal-open');
  setTimeout(() => fTitle.focus(), 50);
}

function closeBookModal() {
  bookModalOverlay.classList.remove('visible');
  document.body.classList.remove('modal-open');
  editingId = null;
}

function setStatus(val) {
  currentStatus = val;
  document.getElementById('status-published').classList.toggle('active', val === 'published');
  document.getElementById('status-draft').classList.toggle('active', val === 'draft');
}

document.getElementById('status-published').addEventListener('click', () => setStatus('published'));
document.getElementById('status-draft').addEventListener('click', () => setStatus('draft'));

function saveBook() {
  let valid = true;

  if (!fTitle.value.trim()) {
    errTitle.classList.add('visible');
    valid = false;
  } else {
    errTitle.classList.remove('visible');
  }

  if (!fAuthor.value.trim()) {
    errAuthor.classList.add('visible');
    valid = false;
  } else {
    errAuthor.classList.remove('visible');
  }

  if (!valid) return;

  const now = new Date().toISOString();
  const tags = fTags.value
    .split(',')
    .map(t => t.trim())
    .filter(Boolean);

  if (editingId) {
    const idx = books.findIndex(b => b.id === editingId);
    if (idx !== -1) {
      books[idx] = {
        ...books[idx],
        title: fTitle.value.trim(),
        author: fAuthor.value.trim(),
        date: fDate.value || todayISO(),
        tags,
        status: currentStatus,
        review: fReview.value,
        updatedAt: now,
      };
    }
  } else {
    books.unshift({
      id: genId(),
      title: fTitle.value.trim(),
      author: fAuthor.value.trim(),
      date: fDate.value || todayISO(),
      tags,
      status: currentStatus,
      review: fReview.value,
      createdAt: now,
      updatedAt: now,
    });
  }

  saveBooks();
  renderList();
  closeBookModal();
}

document.getElementById('modal-save').addEventListener('click', saveBook);
document.getElementById('modal-cancel').addEventListener('click', closeBookModal);
document.getElementById('modal-close').addEventListener('click', closeBookModal);

bookModalOverlay.addEventListener('click', (e) => {
  if (e.target === bookModalOverlay) closeBookModal();
});

document.addEventListener('keydown', (e) => {
  // Cmd/Ctrl+Enter saves if modal is open
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    if (bookModalOverlay.classList.contains('visible')) {
      saveBook();
    }
  }
  // Escape closes whichever modal is open
  if (e.key === 'Escape') {
    if (bookModalOverlay.classList.contains('visible')) {
      closeBookModal();
    } else if (authOverlay.classList.contains('visible')) {
      closeAuthModal();
    }
  }
});

document.getElementById('btn-new-book').addEventListener('click', () => {
  openBookModal(null);
});

/* ── Editor tabs ─────────────────────────────────────────── */
const tabWrite    = document.getElementById('tab-write');
const tabPreview  = document.getElementById('tab-preview');
const writePanel  = document.getElementById('f-review');
const previewPanel = document.getElementById('editor-preview');

function switchTab(which) {
  if (which === 'write') {
    tabWrite.classList.add('active');
    tabPreview.classList.remove('active');
    writePanel.classList.remove('hidden');
    previewPanel.classList.remove('visible');
  } else {
    tabPreview.classList.add('active');
    tabWrite.classList.remove('active');
    writePanel.classList.add('hidden');
    previewPanel.classList.add('visible');
    previewPanel.innerHTML = fReview.value
      ? marked.parse(fReview.value)
      : '<span style="color:#ccc;font-size:12px;">미리볼 내용이 없습니다</span>';
  }
}

tabWrite.addEventListener('click', () => switchTab('write'));
tabPreview.addEventListener('click', () => switchTab('preview'));

/* ── Tab key in textarea inserts 2 spaces ─────────────────── */
fReview.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = fReview.selectionStart;
    const end   = fReview.selectionEnd;
    fReview.value = fReview.value.slice(0, start) + '  ' + fReview.value.slice(end);
    fReview.selectionStart = fReview.selectionEnd = start + 2;
  }
});

/* =============================================================
   INIT
============================================================= */
loadBooks();

if (sessionStorage.getItem(SS_KEY) === '1') {
  isAdmin = true;
  document.body.classList.add('is-admin');
}

renderList();
</script>

</body>
</html>
