<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BLUE CHORD TAPE</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #1a3aff;
  --warm-white: #F9F7F4;
  --dark: #0e1a2e;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Public Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--warm-white);
  color: #1a1a1a;
}

/* ─── FADE-IN ANIMATION ───────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ─── SECTION 1: VISUAL INTRO ─────────────────────────────────── */
.section-intro {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 500px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.video-bg iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: max(100%, 177.78vh);
  height: max(100%, 56.25vw);
  transform: translate(-50%, -50%);
}

.video-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 14, 30, 0.52);
}

.intro-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: fadeUp 1s ease 0.3s both;
}

.tape-logo {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 8px;
}
.reel {
  width: 13px;
  height: 13px;
  border: 1.5px solid rgba(255,255,255,0.85);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reel::after {
  content: '';
  width: 3px;
  height: 3px;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
}
.connector {
  width: 9px;
  height: 1.5px;
  background: rgba(255,255,255,0.85);
}

.intro-title {
  font-size: clamp(2.2rem, 9vw, 6rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  color: #fff;
  line-height: 0.92;
}

.intro-sub {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}

.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.4);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  animation: bob 2s ease-in-out infinite;
}
.scroll-hint::after {
  content: '';
  width: 1px;
  height: 28px;
  background: rgba(255,255,255,0.3);
}
@keyframes bob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%       { transform: translateX(-50%) translateY(6px); }
}

/* ─── SECTION 2: TOOLS ────────────────────────────────────────── */
.section-tools {
  background: var(--warm-white);
  padding: 80px 24px;
}

.section-tools-inner {
  max-width: 860px;
  margin: 0 auto;
}

.section-label {
  display: block;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 32px;
}

.tools-divider {
  width: 100%;
  height: 2px;
  background: var(--primary);
  margin-bottom: 0;
}

.tool-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 16px;
  border-bottom: 1px solid #e2e0db;
  text-decoration: none;
  color: inherit;
  transition: background 0.2s, padding-left 0.2s;
  gap: 16px;
}
.tool-row:hover {
  background: rgba(26, 58, 255, 0.04);
  padding-left: 24px;
}

.tool-row-left {
  display: flex;
  align-items: baseline;
  gap: 24px;
}

@media (min-width: 640px) {
  .tool-row-left { gap: 48px; }
}

.tool-num {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--primary);
  flex-shrink: 0;
}

.tool-name {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0;
  color: #2a2a2a;
  white-space: nowrap;
}

.tool-name span {
  color: #bbb;
  margin: 0 6px;
}

.tool-arrow {
  color: var(--primary);
  font-size: 22px;
  flex-shrink: 0;
  transition: transform 0.2s;
  line-height: 1;
}
.tool-row:hover .tool-arrow { transform: translateX(6px); }

/* ─── SECTION 3: CONTACT & GUESTBOOK ─────────────────────────── */
.section-contact {
  background: var(--dark);
  color: #fff;
  padding: 80px 24px;
}

.section-contact-inner {
  max-width: 860px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 64px;
}

@media (min-width: 768px) {
  .section-contact-inner {
    grid-template-columns: 1fr 1fr;
    gap: 80px;
  }
}

/* Contact info */
.contact-label {
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 28px;
  display: block;
}

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 36px;
}

.contact-info a {
  font-size: 13px;
  letter-spacing: 0.03em;
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  transition: color 0.15s;
}
.contact-info a:hover { color: #fff; }

.social-links {
  display: flex;
  gap: 0;
  flex-wrap: wrap;
}

.social-links a {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  transition: color 0.15s;
  padding-right: 16px;
  margin-right: 16px;
  border-right: 1px solid rgba(255,255,255,0.12);
  line-height: 1.8;
}
.social-links a:last-child {
  border-right: none;
  padding-right: 0;
  margin-right: 0;
}
.social-links a:hover { color: rgba(255,255,255,0.9); }

/* Guestbook form */
.form-label {
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 28px;
  display: block;
}

#guestbook-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.form-field label {
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
}

.form-field input,
.form-field textarea {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding: 10px 0;
  font-family: 'Public Sans', sans-serif;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: #fff;
  outline: none;
  transition: border-color 0.2s;
  resize: none;
  width: 100%;
}

.form-field input:focus,
.form-field textarea:focus {
  border-bottom-color: rgba(255,255,255,0.7);
}

.form-submit {
  padding-top: 4px;
}

.btn-send {
  font-family: 'Public Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #fff;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.4);
  padding: 12px 32px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.btn-send:hover {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.btn-send:active {
  background: #0f27cc;
  border-color: #0f27cc;
}

#guestbook-success {
  display: none;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  padding-top: 12px;
}
</style>
</head>
<body>

<!-- ══ SECTION 1: VISUAL INTRO ══════════════════════════════════ -->
<section class="section-intro">

  <!-- YouTube background -->
  <div class="video-bg">
    <iframe
      title="Blue Chord Tape background video"
      src="https://www.youtube.com/embed/ExWKjZrCyQQ?autoplay=1&mute=1&loop=1&playlist=ExWKjZrCyQQ&controls=0&showinfo=0&rel=0&iv_load_policy=3&disablekb=1&playsinline=1"
      frameborder="0"
      allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    ></iframe>
  </div>

  <!-- Dark overlay -->
  <div class="video-overlay"></div>

  <!-- Title content -->
  <div class="intro-content">
    <div class="tape-logo" aria-hidden="true">
      <div class="reel"></div>
      <div class="connector"></div>
      <div class="reel"></div>
    </div>
    <h1 class="intro-title">Blue Chord Tape</h1>
    <p class="intro-sub">Musician · Analog Player</p>
  </div>

  <!-- Scroll hint -->
  <div class="scroll-hint" aria-hidden="true">Scroll</div>

</section>


<!-- ══ SECTION 2: TOOLS ══════════════════════════════════════════ -->
<section class="section-tools">
  <div class="section-tools-inner">

    <span class="section-label reveal">— Tools —</span>
    <div class="tools-divider reveal"></div>

    <a href="https://sp404-drum-machine.vercel.app" target="_blank" rel="noopener noreferrer" class="tool-row reveal">
      <div class="tool-row-left">
        <span class="tool-num">001</span>
        <span class="tool-name">BCT-404 <span>/</span> Drum Machine</span>
      </div>
      <span class="tool-arrow" aria-hidden="true">→</span>
    </a>

    <a href="https://sampler-sequencer.vercel.app" target="_blank" rel="noopener noreferrer" class="tool-row reveal">
      <div class="tool-row-left">
        <span class="tool-num">002</span>
        <span class="tool-name">BCT-SEQ <span>/</span> Sequencer</span>
      </div>
      <span class="tool-arrow" aria-hidden="true">→</span>
    </a>

    <a href="https://chop-sampler.vercel.app" target="_blank" rel="noopener noreferrer" class="tool-row reveal">
      <div class="tool-row-left">
        <span class="tool-num">003</span>
        <span class="tool-name">BCT-CHOP <span>/</span> Chop Sampler</span>
      </div>
      <span class="tool-arrow" aria-hidden="true">→</span>
    </a>

  </div>
</section>


<!-- ══ SECTION 3: CONTACT & GUESTBOOK ═══════════════════════════ -->
<section class="section-contact">
  <div class="section-contact-inner">

    <!-- Left: Contact -->
    <div class="reveal">
      <span class="contact-label">— Contact —</span>
      <div class="contact-info">
        <a href="mailto:haktyoo@gmail.com">haktyoo@gmail.com</a>
      </div>
      <div class="social-links">
        <a href="https://www.instagram.com/bluechordtape" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.threads.net/@bluechordtape" target="_blank" rel="noopener noreferrer">Threads</a>
        <a href="https://www.youtube.com/@bluechordtape" target="_blank" rel="noopener noreferrer">Youtube</a>
      </div>
    </div>

    <!-- Right: Guestbook -->
    <div class="reveal">
      <span class="form-label">— Leave a Message —</span>

      <form id="guestbook-form" action="https://formspree.io/f/xlgpjjwb" method="POST">
        <div class="form-field">
          <label for="field-name">Name</label>
          <input id="field-name" type="text" name="name" required autocomplete="off"/>
        </div>
        <div class="form-field">
          <label for="field-message">Message</label>
          <textarea id="field-message" name="message" required rows="4"></textarea>
        </div>
        <div class="form-submit">
          <button type="submit" class="btn-send">Send</button>
        </div>
      </form>

      <p id="guestbook-success">메시지가 전달됐습니다 ✓</p>
    </div>

  </div>
</section>

<script>
  // Scroll reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 80);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // Guestbook form
  document.getElementById('guestbook-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('.btn-send');
    btn.textContent = '...';
    btn.disabled = true;
    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        form.style.display = 'none';
        document.getElementById('guestbook-success').style.display = 'block';
      } else {
        btn.textContent = 'Send';
        btn.disabled = false;
      }
    } catch(_) {
      btn.textContent = 'Send';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
