<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BLUE CHORD TAPE | Studio Tools</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#1a3aff",
          "background-light": "#F9F7F4",
          "background-dark": "#221610",
        },
        fontFamily: {
          "display": ["Public Sans", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
      },
    },
  }
</script>
<style>
  body {
    font-family: 'Public Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: max(884px, 100dvh);
  }
  .tape-logo {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .reel {
    width: 12px;
    height: 12px;
    border: 1.5px solid #1a3aff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .reel::after {
    content: '';
    width: 3px;
    height: 3px;
    background-color: #1a3aff;
    border-radius: 50%;
  }
  .connector {
    width: 8px;
    height: 1.5px;
    background-color: #1a3aff;
  }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-300">

<div class="relative flex min-h-screen w-full flex-col max-w-5xl mx-auto px-4 sm:px-6 py-10 md:py-24 pb-32">

  <!-- Logo Section -->
  <header class="mb-8">
    <div class="tape-logo mb-6">
      <div class="reel"></div>
      <div class="connector"></div>
      <div class="reel"></div>
    </div>
    <h1 class="text-slate-900 dark:text-slate-100 tracking-tighter text-[clamp(2rem,10vw,5rem)] font-bold leading-[0.9] uppercase w-full">
      Blue Chord Tape
    </h1>
  </header>

  <!-- Editorial Divider -->
  <div class="w-full h-[2px] bg-primary mb-12"></div>

  <!-- Tool List -->
  <main class="flex flex-col gap-0">

    <!-- Tool Row 001 -->
    <a href="https://sp404-drum-machine.vercel.app" target="_blank" rel="noopener noreferrer"
       class="group flex items-center justify-between py-6 md:py-8 border-b border-slate-200 dark:border-slate-800 hover:bg-primary/5 transition-colors">
      <div class="flex items-baseline gap-4 md:gap-12">
        <span class="text-primary font-medium text-sm md:text-base tracking-widest shrink-0">001</span>
        <h2 class="text-lg sm:text-xl md:text-3xl font-light tracking-tight text-slate-800 dark:text-slate-200">
          BCT-404 <span class="text-slate-400 dark:text-slate-600 mx-1 md:mx-2">/</span> DRUM MACHINE
        </h2>
      </div>
      <div class="text-primary transform transition-transform group-hover:translate-x-2 shrink-0 ml-4">
        <span class="material-symbols-outlined text-3xl font-light">arrow_right_alt</span>
      </div>
    </a>

    <!-- Tool Row 002 -->
    <a href="https://sampler-sequencer.vercel.app" target="_blank" rel="noopener noreferrer"
       class="group flex items-center justify-between py-6 md:py-8 border-b border-slate-200 dark:border-slate-800 hover:bg-primary/5 transition-colors">
      <div class="flex items-baseline gap-4 md:gap-12">
        <span class="text-primary font-medium text-sm md:text-base tracking-widest shrink-0">002</span>
        <h2 class="text-lg sm:text-xl md:text-3xl font-light tracking-tight text-slate-800 dark:text-slate-200">
          BCT-SEQ <span class="text-slate-400 dark:text-slate-600 mx-1 md:mx-2">/</span> SEQUENCER
        </h2>
      </div>
      <div class="text-primary transform transition-transform group-hover:translate-x-2 shrink-0 ml-4">
        <span class="material-symbols-outlined text-3xl font-light">arrow_right_alt</span>
      </div>
    </a>

    <!-- Tool Row 003 -->
    <a href="https://chop-sampler.vercel.app" target="_blank" rel="noopener noreferrer"
       class="group flex items-center justify-between py-6 md:py-8 border-b border-slate-200 dark:border-slate-800 hover:bg-primary/5 transition-colors">
      <div class="flex items-baseline gap-4 md:gap-12">
        <span class="text-primary font-medium text-sm md:text-base tracking-widest shrink-0">003</span>
        <h2 class="text-lg sm:text-xl md:text-3xl font-light tracking-tight text-slate-800 dark:text-slate-200">
          BCT-CHOP <span class="text-slate-400 dark:text-slate-600 mx-1 md:mx-2">/</span> CHOP SAMPLER
        </h2>
      </div>
      <div class="text-primary transform transition-transform group-hover:translate-x-2 shrink-0 ml-4">
        <span class="material-symbols-outlined text-3xl font-light">arrow_right_alt</span>
      </div>
    </a>

  </main>

  <!-- Latest Releases Section -->
  <section class="mt-16 md:mt-24">
    <div class="w-full h-px bg-slate-200 dark:bg-slate-800 mb-10"></div>
    <div class="flex items-center justify-between mb-8">
      <span class="text-xs uppercase tracking-[0.3em] text-slate-400 dark:text-slate-500">— Latest Releases —</span>
      <a href="https://www.youtube.com/@bluechordtape" target="_blank" rel="noopener noreferrer"
         class="text-xs uppercase tracking-[0.2em] text-primary hover:opacity-60 transition-opacity">
        View All ↗
      </a>
    </div>

    <!-- Video grid -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 md:gap-8">

      <div class="flex flex-col gap-3">
        <div class="relative w-full rounded overflow-hidden" style="padding-bottom:56.25%">
          <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/ExWKjZrCyQQ"
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <div class="relative w-full rounded overflow-hidden" style="padding-bottom:56.25%">
          <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/BNMxQgD0zUE"
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <div class="relative w-full rounded overflow-hidden" style="padding-bottom:56.25%">
          <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/W71h7vCSOl8"
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="mt-16 md:mt-24 flex flex-col md:flex-row justify-between items-start md:items-center gap-8 border-t border-slate-200 dark:border-slate-800 pt-8">
    <div class="flex gap-6 md:gap-8 text-xs uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">
      <a class="hover:text-primary transition-colors" href="https://www.instagram.com/bluechordtape" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="hover:text-primary transition-colors" href="https://www.threads.net/@bluechordtape" target="_blank" rel="noopener noreferrer">Threads</a>
      <a class="hover:text-primary transition-colors" href="https://www.youtube.com/@bluechordtape" target="_blank" rel="noopener noreferrer">Youtube</a>
    </div>
  </footer>

</div>

<!-- Bottom Navigation -->
<div class="fixed bottom-0 left-0 right-0 z-50 flex justify-center pb-6 px-4 pointer-events-none">
  <nav class="flex items-center gap-1 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border border-slate-200 dark:border-slate-800 rounded-full px-3 py-2 shadow-2xl pointer-events-auto">
    <a class="flex h-12 w-12 items-center justify-center rounded-full bg-primary text-white shadow-lg" href="#">
      <span class="material-symbols-outlined">home</span>
    </a>
    <a class="flex h-12 w-12 items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="#">
      <span class="material-symbols-outlined">search</span>
    </a>
    <a class="flex h-12 w-12 items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="#">
      <span class="material-symbols-outlined">settings_input_component</span>
    </a>
    <a class="flex h-12 w-12 items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" href="#">
      <span class="material-symbols-outlined">person</span>
    </a>
  </nav>
</div>

</body>
</html>
