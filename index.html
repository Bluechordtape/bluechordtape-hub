<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BLUE CHORD TAPE</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #1a3aff;
  --warm-white: #F9F7F4;
  --dark: #0e1a2e;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Public Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--warm-white);
  color: #1a1a1a;
}

/* ─── FADE-IN ANIMATION ───────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ─── SECTION 1: VISUAL INTRO ─────────────────────────────────── */
.section-intro {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 500px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.video-bg iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: max(100%, 177.78vh);
  height: max(100%, 56.25vw);
  transform: translate(-50%, -50%);
}

.video-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 14, 30, 0.52);
}

.intro-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: fadeUp 1s ease 0.3s both;
}

.tape-logo {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 8px;
}
.reel {
  width: 13px;
  height: 13px;
  border: 1.5px solid rgba(255,255,255,0.85);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reel::after {
  content: '';
  width: 3px;
  height: 3px;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
}
.connector {
  width: 9px;
  height: 1.5px;
  background: rgba(255,255,255,0.85);
}

.intro-title {
  font-size: clamp(2.2rem, 9vw, 6rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  color: #fff;
  line-height: 0.92;
}

.intro-sub {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}

.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.4);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  animation: bob 2s ease-in-out infinite;
}
.scroll-hint::after {
  content: '';
  width: 1px;
  height: 28px;
  background: rgba(255,255,255,0.3);
}
@keyframes bob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%       { transform: translateX(-50%) translateY(6px); }
}

/* ─── SECTION 2: TOOLS ────────────────────────────────────────── */
.section-tools {
  background: var(--warm-white);
  padding: 80px 24px;
}

.section-tools-inner {
  max-width: 860px;
  margin: 0 auto;
}

.section-label {
  display: block;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 32px;
}

.tools-divider {
  width: 100%;
  height: 2px;
  background: var(--primary);
  margin-bottom: 0;
}

.tool-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 16px;
  border-bottom: 1px solid #e2e0db;
  text-decoration: none;
  color: inherit;
  transition: background 0.2s, padding-left 0.2s;
  gap: 16px;
}
.tool-row:hover {
  background: rgba(26, 58, 255, 0.04);
  padding-left: 24px;
}

.tool-row-left {
  display: flex;
  align-items: baseline;
  gap: 24px;
}

@media (min-width: 640px) {
  .tool-row-left { gap: 48px; }
}

.tool-num {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--primary);
  flex-shrink: 0;
}

.tool-name {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0;
  color: #2a2a2a;
  white-space: nowrap;
}

.tool-name span {
  color: #bbb;
  margin: 0 6px;
}

.tool-arrow {
  color: var(--primary);
  font-size: 22px;
  flex-shrink: 0;
  transition: transform 0.2s;
  line-height: 1;
}
.tool-row:hover .tool-arrow { transform: translateX(6px); }

/* ─── SECTION 3: CONTACT & GUESTBOOK ─────────────────────────── */
.section-contact {
  background: var(--dark);
  color: #fff;
  padding: 80px 24px;
}

.section-contact-inner {
  max-width: 860px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 64px;
}

@media (min-width: 768px) {
  .section-contact-inner {
    grid-template-columns: 1fr 1fr;
    gap: 80px;
  }
}

/* Contact info */
.contact-label {
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 28px;
  display: block;
}

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 36px;
}

.contact-info a {
  font-size: 13px;
  letter-spacing: 0.03em;
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  transition: color 0.15s;
}
.contact-info a:hover { color: #fff; }

.social-links {
  display: flex;
  gap: 0;
  flex-wrap: wrap;
}

.social-links a {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  transition: color 0.15s;
  padding-right: 16px;
  margin-right: 16px;
  border-right: 1px solid rgba(255,255,255,0.12);
  line-height: 1.8;
}
.social-links a:last-child {
  border-right: none;
  padding-right: 0;
  margin-right: 0;
}
.social-links a:hover { color: rgba(255,255,255,0.9); }

/* Guestbook form */
.form-label {
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 28px;
  display: block;
}

#guestbook-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.form-field label {
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
}

.form-field input,
.form-field textarea {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding: 10px 0;
  font-family: 'Public Sans', sans-serif;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: #fff;
  outline: none;
  transition: border-color 0.2s;
  resize: none;
  width: 100%;
}

.form-field input:focus,
.form-field textarea:focus {
  border-bottom-color: rgba(255,255,255,0.7);
}

.form-submit {
  padding-top: 4px;
}

.btn-send {
  font-family: 'Public Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #fff;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.4);
  padding: 12px 32px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.btn-send:hover {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.btn-send:active {
  background: #0f27cc;
  border-color: #0f27cc;
}

#guestbook-success {
  display: none;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  padding-top: 12px;
}

/* ─── SECTION: UNIVERSE / GRAPH ──────────────────────────── */
.section-graph {
  background: #07111e;
  padding: 80px 24px;
  overflow: hidden;
}
.section-graph-inner {
  max-width: 860px;
  margin: 0 auto;
}
#graph-canvas {
  display: block;
  width: 100%;
  margin-top: 32px;
}
</style>
</head>

<section class="section-intro">

<script>
  // Scroll reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 80);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // ── GRAPH / UNIVERSE ────────────────────────────────────────
  ;(function () {
    const canvas = document.getElementById('graph-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const NODES = [
      { id: 'hub',        label: 'Blue Chord Tape', type: 'hub',  r: 9   },
      { id: 'music',      label: 'Music',           type: 'main', r: 6   },
      { id: 'guitar',     label: 'Guitar',          type: 'main', r: 6   },
      { id: 'reading',    label: 'Reading',         type: 'main', r: 6   },
      { id: 'photo',      label: 'Photo / Video',   type: 'main', r: 6   },
      { id: 'spotify',      label: 'Spotify Playlist', type: 'sub',  r: 3.5 },
      { id: 'still-reading', label: 'Still Reading',  type: 'sub',  r: 3.5, url: 'https://open.spotify.com/playlist/0xAtic0IQXykZO5M8HM1k2?si=qDIwHaStRmG95bkq7y_VJw&pi=bJg9qP4jRn2M-' },
      { id: 'sampling',   label: 'Sampling',        type: 'sub',  r: 3.5 },
      { id: 'lofi',       label: 'Lo-fi',           type: 'sub',  r: 3.5 },
      { id: 'beatmaking', label: 'Beat Making',     type: 'sub',  r: 3.5 },
      { id: 'sp404',      label: 'SP-404',          type: 'sub',  r: 3.5 },
      { id: 'electric',   label: 'Electric',        type: 'sub',  r: 3.5 },
      { id: 'pedals',     label: 'Pedals & FX',     type: 'sub',  r: 3.5 },
      { id: 'books',      label: 'Books',           type: 'sub',  r: 3.5, url: '/books.html' },
      { id: 'philosophy', label: 'Philosophy',      type: 'sub',  r: 3.5 },
      { id: 'performance', label: 'Performance Video', type: 'sub',  r: 3.5, url: 'https://www.youtube.com/@bluechordtape' },
      { id: 'film',       label: 'Film',            type: 'sub',  r: 3.5 },
      { id: 'portrait',   label: 'Portrait',        type: 'sub',  r: 3.5 },
      { id: 'cinematic',  label: 'Cinematic',       type: 'sub',  r: 3.5 },
    ];

    const EDGES = [
      ['hub','music',140],['hub','guitar',140],['hub','reading',140],['hub','photo',140],
      ['music','spotify',80],['spotify','still-reading',70],
      ['music','sampling',80],['music','lofi',80],['music','beatmaking',80],['music','sp404',80],
      ['guitar','electric',80],['guitar','pedals',80],
      ['reading','books',80],['reading','philosophy',80],
      ['lofi','guitar',160],['sp404','beatmaking',55],
      ['photo','performance',80],['photo','film',80],['photo','portrait',80],['photo','cinematic',80],
      ['cinematic','music',170],
      ['performance','guitar',160],
    ];

    const map = {};
    NODES.forEach(n => {
      n.vx = 0; n.vy = 0;
      // coherent drift: each node slowly orbits in its own direction
      n.driftAngle = Math.random() * Math.PI * 2;
      n.driftSpeed = 0.004 + Math.random() * 0.003;
      map[n.id] = n;
    });
    const edges = EDGES.map(([s, t, d]) => ({ a: map[s], b: map[t], d }));
    let W, H, cx, cy, hovered = null, dragged = null;
    let dragOffX = 0, dragOffY = 0, dragVX = 0, dragVY = 0, lastMX = 0, lastMY = 0;
    let dragStartX = 0, dragStartY = 0, dragMoved = false;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = canvas.parentElement.getBoundingClientRect().width;
      H = Math.min(480, Math.max(280, W * 0.5));
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      canvas.width  = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = W / 2; cy = H / 2;
      place();
    }

    function place() {
      map.hub.x = cx; map.hub.y = cy;
      const mains = NODES.filter(n => n.type === 'main');
      mains.forEach((n, i) => {
        const a = (i / mains.length) * Math.PI * 2 - Math.PI / 2;
        n.x = cx + Math.cos(a) * 135;
        n.y = cy + Math.sin(a) * 95;
      });
      NODES.filter(n => n.type === 'sub').forEach(n => {
        const e = edges.find(e => (e.b === n && e.a.type === 'main') || (e.a === n && e.b.type === 'main'));
        const p = e ? (e.b === n ? e.a : e.b) : map.hub;
        const a = Math.random() * Math.PI * 2;
        n.x = p.x + Math.cos(a) * 80;
        n.y = p.y + Math.sin(a) * 80;
      });
    }

    function simulate() {
      // Repulsion — softened so nodes don't snap/jump
      for (let i = 0; i < NODES.length; i++) {
        for (let j = i + 1; j < NODES.length; j++) {
          const a = NODES[i], b = NODES[j];
          const dx = b.x - a.x || .01, dy = b.y - a.y || .01;
          const d2 = dx*dx + dy*dy, d = Math.sqrt(d2);
          const f = 900 / (d2 + 80); // softened: +80 prevents infinite force at close range
          a.vx -= dx/d*f; a.vy -= dy/d*f;
          b.vx += dx/d*f; b.vy += dy/d*f;
        }
      }
      // Springs — looser so nodes flow more freely
      edges.forEach(({ a, b, d }) => {
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const f = (dist - d) * 0.016;
        const fx = dx/dist*f, fy = dy/dist*f;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      });
      NODES.forEach(n => {
        if (n === dragged) return;
        // Coherent drift: each node slowly turns its own angle → smooth, organic motion
        n.driftAngle += n.driftSpeed;
        n.vx += Math.cos(n.driftAngle) * 0.013;
        n.vy += Math.sin(n.driftAngle) * 0.013;
        // Very weak center gravity — just enough to keep nodes from drifting offscreen
        n.vx += (cx - n.x) * 0.0006;
        n.vy += (cy - n.y) * 0.0006;
        // High damping = heavy water / space inertia (velocity half-life ~23 frames)
        n.vx *= 0.97; n.vy *= 0.97;
        n.x += n.vx; n.y += n.vy;
        n.x = Math.max(30, Math.min(W - 30, n.x));
        n.y = Math.max(30, Math.min(H - 30, n.y));
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const active = dragged || hovered;
      const connIds = active
        ? new Set(edges.filter(e => e.a===active||e.b===active).flatMap(e => [e.a.id, e.b.id]))
        : null;

      edges.forEach(({ a, b }) => {
        const hl = active && (a===active || b===active);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = hl ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.1)';
        ctx.lineWidth = hl ? 1.2 : 0.8;
        ctx.stroke();
      });

      NODES.forEach(n => {
        const conn = connIds ? connIds.has(n.id) : true;
        const isActive = n === active;
        ctx.save();
        ctx.globalAlpha = active ? (conn ? 1 : 0.15) : 1;
        if (n.type === 'hub' || isActive) {
          ctx.shadowBlur = isActive ? 22 : 16;
          ctx.shadowColor = n.type === 'hub' ? '#1a3aff' : 'rgba(255,255,255,0.9)';
        }
        ctx.beginPath();
        ctx.arc(n.x, n.y, isActive ? n.r * 1.5 : n.r, 0, Math.PI * 2);
        ctx.fillStyle = n.type === 'hub'  ? '#1a3aff'
                      : n.url             ? '#1DB954'
                      : n.type === 'main' ? 'rgba(255,255,255,0.9)'
                      : 'rgba(255,255,255,0.5)';
        ctx.fill();
        ctx.restore();

        const showLbl = n.type !== 'sub' || isActive || (connIds && connIds.has(n.id));
        if (showLbl) {
          ctx.save();
          ctx.globalAlpha = active ? (conn ? 1 : 0.08) : (n.type === 'sub' ? 0.65 : 1);
          ctx.fillStyle = '#fff';
          ctx.font = `${n.type==='hub'?'500':'400'} ${n.type==='hub'?'12':'10'}px 'Public Sans',sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(n.label, n.x, n.y + n.r + 13);
          ctx.restore();
        }
      });
    }

    function loop() { simulate(); draw(); requestAnimationFrame(loop); }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return { mx: src.clientX - rect.left, my: src.clientY - rect.top };
    }

    function startDrag(mx, my) {
      for (const n of NODES) {
        if (Math.hypot(n.x - mx, n.y - my) < n.r + 12) {
          dragged = n;
          dragOffX = n.x - mx; dragOffY = n.y - my;
          lastMX = mx; lastMY = my;
          dragStartX = mx; dragStartY = my;
          dragVX = 0; dragVY = 0;
          dragMoved = false;
          break;
        }
      }
    }

    function moveDrag(mx, my) {
      if (dragged) {
        if (Math.hypot(mx - dragStartX, my - dragStartY) > 4) dragMoved = true;
        dragVX = mx - lastMX; dragVY = my - lastMY;
        lastMX = mx; lastMY = my;
        dragged.x = mx + dragOffX;
        dragged.y = my + dragOffY;
        dragged.vx = 0; dragged.vy = 0;
        canvas.style.cursor = 'grabbing';
      } else {
        hovered = null;
        for (const n of NODES) {
          if (Math.hypot(n.x - mx, n.y - my) < n.r + 10) { hovered = n; break; }
        }
        canvas.style.cursor = hovered ? (hovered.url ? 'pointer' : 'grab') : 'default';
      }
    }

    function endDrag() {
      if (dragged) {
        if (!dragMoved && dragged.url) window.open(dragged.url, '_blank', 'noopener');
        dragged.vx = dragVX * 1.0;
        dragged.vy = dragVY * 1.0;
        dragged = null;
      }
      canvas.style.cursor = hovered ? (hovered.url ? 'pointer' : 'grab') : 'default';
    }

    canvas.addEventListener('mousedown',  e => { const {mx,my} = getPos(e); startDrag(mx,my); });
    canvas.addEventListener('mousemove',  e => { const {mx,my} = getPos(e); moveDrag(mx,my); });
    canvas.addEventListener('mouseup',    () => endDrag());
    canvas.addEventListener('mouseleave', () => { hovered = null; endDrag(); });

    canvas.addEventListener('touchstart',  e => { e.preventDefault(); const {mx,my} = getPos(e); startDrag(mx,my); }, { passive: false });
    canvas.addEventListener('touchmove',   e => { e.preventDefault(); const {mx,my} = getPos(e); moveDrag(mx,my); },  { passive: false });
    canvas.addEventListener('touchend',    () => endDrag());

    window.addEventListener('resize', resize);
    resize();
    loop();
  })();

  // Guestbook form
  document.getElementById('guestbook-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('.btn-send');
    btn.textContent = '...';
    btn.disabled = true;
    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        form.style.display = 'none';
        document.getElementById('guestbook-success').style.display = 'block';
      } else {
        btn.textContent = 'Send';
        btn.disabled = false;
      }
    } catch(_) {
      btn.textContent = 'Send';
      btn.disabled = false;
    }
  });
</script>
